/* ================================================================
   FORMATTERS
   ================================================================ */
const fmtD = d => d ? new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"}) : "—";
const fmtDISO = d => { if(!d) return ""; const dt=new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; };
const fmtN = (v,d=2) => (v==null||isNaN(v)) ? "—" : Number(v).toFixed(d);
const fmtRs = v => {
  if (v==null || isNaN(v)) return "—";
  const n = Number(v);
  const sign = n < 0 ? "-" : "";
  return sign + "₹" + Math.abs(Math.round(n)).toLocaleString("en-IN");
};
const inr = v => (v==null||isNaN(v)) ? "—" : Number(v).toLocaleString("en-IN",{maximumFractionDigits:2});
const csvEsc = v => {
  if (v == null) return "";
  const s = String(v);
  return (s.indexOf(",") >= 0 || s.indexOf('"') >= 0 || s.indexOf("\n") >= 0)
    ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const downloadCSV = (filename, rows) => {
  const csv = rows.map(r => r.map(csvEsc).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 500);
};
const dateStamp = () => {
  const d = new Date();

};

/* ================================================================
   PARSE DATE CELL (Excel serial + string)
   ================================================================ */
function parseDateCell(s) {
  if (s == null) return null;
  const str = String(s).trim();
  if (!str) return null;
  if (str.indexOf("/") === -1 && str.indexOf("-") === -1 && str.indexOf(":") === -1) {
    const n = parseFloat(str);
    if (!isNaN(n) && n > 25000 && n < 100000) {
      const ms = (n - 25569) * 86400 * 1000;
      const d = new Date(ms);
      if (!isNaN(d.getTime())) return d;
    }
  }
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

/* ================================================================
   FETCH VIA PROXY (multi-fallback)
   ================================================================ */
async function fetchViaProxy(url) {
  const proxies = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://api.cors.lol/?url=" + encodeURIComponent(url),
    "https://thingproxy.freeboard.io/fetch/" + url,
    "https://corsproxy.io/?url=" + encodeURIComponent(url)
  ];
  let lastErr = "";
  for (let i = 0; i < proxies.length; i++) {
    try {
      const res = await fetch(proxies[i]);
      if (!res.ok) { lastErr = "HTTP " + res.status; continue; }
      const text = await res.text();
      if (text && text.length > 20) return text;
    } catch (e) { lastErr = e.message; }
  }
  throw new Error("Data नहीं मिला (" + lastErr + ")");
}

/* ================================================================
   YAHOO → CSV (returns text)
   ================================================================ */
async function fetchFromYahoo(sym, range) {
  const clean = String(sym).toUpperCase().replace(/^NSE:/, "").trim();
  const ySym = clean + ".NS";
  const rng = range || DEFAULT_RANGE;
  const yUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + ySym + "?interval=1d&range=" + rng;
  const text = await fetchViaProxy(yUrl);
  let json;
  try { json = JSON.parse(text); } catch (e) { throw new Error("Yahoo response गलत"); }
  const r = json && json.chart && json.chart.result && json.chart.result[0];
  if (!r) throw new Error("Symbol गलत है या NSE पर listed नहीं");
  const ts = r.timestamp || [];
  const q = (r.indicators && r.indicators.quote && r.indicators.quote[0]) || {};
  const lines = ["Date,Open,High,Low,Close,Volume"];
  for (let i = 0; i < ts.length; i++) {
    const d = new Date(ts[i] * 1000);
    const ds = (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear();
    const o = q.open ? q.open[i] : null;
    const h = q.high ? q.high[i] : null;
    const l = q.low ? q.low[i] : null;
    const c = q.close ? q.close[i] : null;
    const v = q.volume ? q.volume[i] : 0;
    if (o == null || h == null || l == null || c == null) continue;
    lines.push(ds + "," + o + "," + h + "," + l + "," + c + "," + (v || 0));
  }
  if (lines.length < 31) throw new Error("कम data मिला (" + (lines.length-1) + " rows)");
  return { csv: lines.join("\n"), name: "NSE:" + clean, rows: lines.length - 1 };
}

/* ================================================================
   FETCH FROM APPS SCRIPT (JSON) — primary source
   ================================================================ */
async function fetchSheetStocks() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_") === 0) {
    throw new Error("Apps Script URL set नहीं किया");
  }
  const res = await fetch(APPS_SCRIPT_URL);
  if (!res.ok) throw new Error("Apps Script HTTP " + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  const headers = json.headers || [];
  const rows = json.stocks || [];
  if (!rows.length) throw new Error("Sheet में कोई data नहीं मिला");
  const findCol = (...names) => {
    for (const n of names) {
      const k = headers.find(h => String(h).toLowerCase().replace(/\s+/g,"") === n.toLowerCase().replace(/\s+/g,""));
      if (k) return k;
    }
    for (const n of names) {
      const k = headers.find(h => String(h).toLowerCase().includes(n.toLowerCase()));
      if (k) return k;
    }
    return null;
  };
  const symCol  = findCol("symbol","sym","ticker","stock","scrip","nsecode");
  const nameCol = findCol("name","company","stockname","description");
  if (!symCol) throw new Error(`"Symbol" column नहीं मिला। मिले: ${headers.join(", ")}`);
  const stocks = rows
    .map(r => ({
      sym:  String(r[symCol] || "").trim().toUpperCase().replace(/\.NS$|^NSE:/i, ""),
      name: String(r[nameCol] || r[symCol] || "").trim(),
    }))
    .filter(s => s.sym && /^[A-Z0-9&\-]+$/.test(s.sym));
  if (!stocks.length) throw new Error("Sheet में valid symbol नहीं मिला");
  return { stocks, cols: headers, totalRows: rows.length };
}

/* ================================================================
   PARSE CSV
   ================================================================ */
function parseCSV(raw) {
  if (!raw?.trim()) return { error:"CSV खाली है।" };
  const lines = raw.trim().split("\n").map(l=>l.trim()).filter(Boolean);
  let hIdx = -1;
  for (let i=0;i<Math.min(lines.length,10);i++) {
    if (/^date/i.test(lines[i])) { hIdx = i; break; }
  }
  if (hIdx===-1) return { error:'"Date,Open,High,Low,Close" header नहीं मिला।' };
  const hdr = lines[hIdx].split(",").map(h=>h.trim().toLowerCase());
  const gi = (...ns) => { for (const n of ns) { const x=hdr.indexOf(n); if (x>=0) return x; } return -1; };
  const di=gi("date","datetime","time"), oi=gi("open"), hi=gi("high"), li=gi("low"), ci=gi("close"), vi=gi("volume","vol");
  if ([di,hi,li].some(x=>x<0)) return { error:"Date/High/Low कॉलम नहीं मिले।" };
  const rows = [];
  for (let i=hIdx+1;i<lines.length;i++) {
    const p = lines[i].split(",");
    if (p.length<4) continue;
    const date = parseDateCell(p[di]);
    if (!date) continue;
    const high=parseFloat(p[hi]), low=parseFloat(p[li]);
    const close = ci>=0 ? parseFloat(p[ci]) : high;
    const open  = oi>=0 ? parseFloat(p[oi]) : close;
    const vol   = vi>=0 ? parseInt(p[vi])||0 : 0;
    if (isNaN(high)||isNaN(low)) continue;
    rows.push({ date, open, high, low, close, vol, ts:date.getTime() });
  }
  rows.sort((a,b)=>a.ts-b.ts);
  if (rows.length < 30) return { error:"कम से कम 30 rows चाहिए।" };
  return { stockName: "", rows };
}

function isoWeekKey(d) {
  const t = new Date(d); t.setHours(0,0,0,0);
  const day = t.getDay() || 7;
  t.setDate(t.getDate() + 4 - day);
  const yStart = new Date(t.getFullYear(),0,1);
  const wk = Math.ceil((((t - yStart)/86400000)+1)/7);
  return t.getFullYear()+"-W"+String(wk).padStart(2,"0");
}

function filterRowsByDate(rows, fromStr, toStr) {
  if (!fromStr && !toStr) return rows;
  const from = fromStr ? new Date(fromStr + "T00:00:00") : null;
  const to   = toStr   ? new Date(toStr   + "T23:59:59") : null;
  return rows.filter(r => {
    if (from && r.date < from) return false;
    if (to   && r.date > to)   return false;
    return true;
  });
}

/* ================================================================
   CORE ENGINE — Darvas Rules (कभी नहीं बदलेगा)
   ================================================================ */
function calcWeekly(rows, sourceKey="1w", totalCapital=DEFAULT_CAPITAL) {
  const perPart = totalCapital / PARTS;
  const enriched = rows.map(r => ({ ...r, wk: isoWeekKey(r.date), events: [] }));
  const wkHigh = {}, wkLow = {};
  enriched.forEach(r => {
    if (wkHigh[r.wk]==null || r.high>wkHigh[r.wk]) wkHigh[r.wk]=r.high;
    if (wkLow [r.wk]==null || r.low <wkLow [r.wk]) wkLow [r.wk]=r.low;
  });
  const wks = [...new Set(enriched.map(r=>r.wk))];
  const lookback = sourceKey === "2w" ? 2 : sourceKey === "4w" ? 4 : 1;
  const wkTrigger = {};
  wks.forEach((w,i) => {
    if (i < lookback) { wkTrigger[w] = null; return; }
    let mx = -Infinity;
    for (let j = i-lookback; j < i; j++) if (wkHigh[wks[j]] > mx) mx = wkHigh[wks[j]];
    wkTrigger[w] = mx === -Infinity ? null : mx;
  });
  const rowsOut = enriched.map(r => ({ ...r, wkTrigger: wkTrigger[r.wk], buyPrice:null, position:null }));
  let state="IDLE", shares=0, cost=0, avg=0, target=0, partsUsed=0;
  let lastBuyTrig=null, entryDate=null, entryIdx=-1;
  const trades = [];
  let curWk=null, boughtThisWeek=false, ignoredThisWeek=false, soldThisWeek=false;

  for (let i=0;i<rowsOut.length;i++) {
    const r = rowsOut[i];
    const trig = wkTrigger[r.wk];

    if (r.wk !== curWk) {
      curWk = r.wk; boughtThisWeek=false; ignoredThisWeek=false; soldThisWeek=false;
      if (state==="IN_POSITION" && lastBuyTrig!=null && trig!=null) {
        const diff = Math.abs(trig-lastBuyTrig)/lastBuyTrig;
        if (diff <= IGNORE_PCT) { ignoredThisWeek = true; r.events.push("ignore"); }
      }
    }
    if (trig == null) continue;

    if (state==="IN_POSITION" && r.high >= target - 0.0001) {
      const exitPrice = target;
      const pnl = shares*exitPrice - cost;
      trades.push({ entryDate, exitDate:r.date, entry:lastBuyTrig, exit:exitPrice, days:i-entryIdx, shares, cost, proceeds:shares*exitPrice, pnl, pct:(exitPrice/avg-1)*100, partsUsed });
      r.events.push("target");
      state="IDLE"; shares=0; cost=0; avg=0; target=0; partsUsed=0;
      lastBuyTrig=null; entryDate=null; entryIdx=-1; soldThisWeek=true;
      continue;
    }

    const canBuy = !boughtThisWeek && !ignoredThisWeek && !soldThisWeek
                   && partsUsed < PARTS
                   && r.low <= trig && trig <= r.high;

    if (canBuy) {
      let qty = Math.floor(perPart / trig);
      if (qty < 1) qty = 1;
      shares += qty; cost += qty*trig; avg = cost/shares;
      target = avg*(1+TARGET_PCT);
      partsUsed++;
      if (state==="IDLE") { entryDate = r.date; entryIdx = i; }
      state="IN_POSITION"; lastBuyTrig=trig; boughtThisWeek=true;
      r.events.push("buy"); r.buyPrice=trig;
      r.position = { avg, target, shares, qty, partsUsed };

      if (r.high >= target - 0.0001) {
        const exitPrice = target;
        const pnl = shares*exitPrice - cost;
        trades.push({ entryDate, exitDate:r.date, entry:trig, exit:exitPrice, days:i-entryIdx, shares, cost, proceeds:shares*exitPrice, pnl, pct:(exitPrice/avg-1)*100, partsUsed });
        r.events.push("target");
        state="IDLE"; shares=0; cost=0; avg=0; target=0; partsUsed=0;
        lastBuyTrig=null; entryDate=null; entryIdx=-1; soldThisWeek=true;
      }
    }
  }

  let openPosition = null;
  if (state==="IN_POSITION") {
    const last = rowsOut[rowsOut.length-1];
    openPosition = { shares, avg, target, lastBuyTrig, entryDate, mark:last.close, unrealized:shares*last.close-cost, cost, partsUsed };
  }
  const lastWk = wks[wks.length-1];
  const pendingTrigger = wkHigh[lastWk];
  return { rows:rowsOut, trades, openPosition, pendingTrigger, perPart };
}

/* ================================================================
   BOH FILTER (unchanged)
   ================================================================ */
function checkBOH(rows) {
  if (!rows || rows.length < 60) {
    return { suitable:false, reason:"Data kam", cmp:null, high52:null, low52:null, pctFromLow:null, pctFromHigh:null, pct1M:null };
  }
  const last252 = rows.slice(-252);
  const cmp    = rows[rows.length-1].close;
  const high52 = Math.max(...last252.map(r=>r.high));
  const low52  = Math.min(...last252.map(r=>r.low));
  const pctFromLow  = ((cmp - low52)  / low52)  * 100;
  const pctFromHigh = ((high52 - cmp) / high52) * 100;
  const oneMAgo = rows[Math.max(0, rows.length-22)]?.close || cmp;
  const pct1M   = ((cmp - oneMAgo) / oneMAgo) * 100;
  const cond1 = pctFromLow >= 5;
  const cond2 = pctFromHigh <= 45;
  const cond3 = pct1M > -3;
  const suitable = cond1 && cond2 && cond3;
  let reason = "PASS";
  if (!cond1) reason = "52W Low के करीब";
  else if (!cond2) reason = "52W High से बहुत गिरा";
  else if (!cond3) reason = "1M trend negative";
  return { suitable, reason, cmp, high52, low52, pctFromLow, pctFromHigh, pct1M };
}

/* ================================================================
   PORTFOLIO STATS (per-stock breakdown)
   ================================================================ */
function calcPortfolioStats(stocks) {
  if (!stocks || !stocks.length) return null;
  let totalTrades = 0, wins = 0, losses = 0, grossWin = 0, grossLoss = 0;
  let heldDays = 0, openCount = 0, idleCount = 0;
  let totalInvestedRs = 0, totalProfitRs = 0, totalReturnedRs = 0;
  const perStock = [];
  for (let i = 0; i < stocks.length; i++) {
    const s = stocks[i];
    const t = s.trades || [];
    let w = 0, l = 0, sw = 0, sl = 0, d = 0;
    let investedRs = 0, returnedRs = 0, profitRs = 0;
    for (let j = 0; j < t.length; j++) {
      const tr = t[j];
      if (tr.pnl > 0) { w++; sw += tr.pct; } else { l++; sl += Math.abs(tr.pct); }
      d += (tr.days || 0);
      investedRs += tr.cost;
      returnedRs += tr.proceeds;
      profitRs += tr.pnl;
    }
    totalTrades += t.length; wins += w; losses += l;
    grossWin += sw; grossLoss += sl; heldDays += d;
    totalInvestedRs += investedRs;
    totalReturnedRs += returnedRs;
    totalProfitRs += profitRs;
    const status = s.openPosition ? "HOLDING" : "IDLE";
    if (s.openPosition) openCount++; else idleCount++;
    const lastRow = s.rows && s.rows.length ? s.rows[s.rows.length - 1] : null;
    perStock.push({
      name: s.name, trades: t.length, wins: w, losses: l,
      winRate: t.length ? (w / t.length) * 100 : 0,
      avgWin: w ? sw / w : 0,
      avgLoss: l ? sl / l : 0,
      netPct: sw - sl, status: status,
      lastClose: lastRow ? lastRow.close : null,
      investedRs, returnedRs, profitRs,
      partsUsed: s.openPosition ? s.openPosition.partsUsed : 0,
    });
  }
  const winRate = totalTrades ? (wins / totalTrades) * 100 : 0;
  const avgWin = wins ? grossWin / wins : 0;
  const avgLoss = losses ? grossLoss / losses : 0;
  const profitFactor = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0);
  const expectancy = totalTrades ? ((wins / totalTrades) * avgWin - (losses / totalTrades) * avgLoss) : 0;
  return {
    totalStocks: stocks.length, totalTrades,
    wins, losses, winRate,
    avgWin, avgLoss,
    grossWin, grossLoss,
    netPct: grossWin - grossLoss,
    profitFactor, expectancy,
    openCount, idleCount,
    avgHeldDays: totalTrades ? heldDays / totalTrades : 0,
    totalInvestedRs, totalReturnedRs, totalProfitRs,
    perStock
  };
}

/* ================================================================
   EQUITY CURVE
   ================================================================ */
function calcEquityCurve(stocks) {
  if (!stocks || !stocks.length) return null;
  const allTrades = [];
  for (let i = 0; i < stocks.length; i++) {
    const s = stocks[i];
    const trades = s.trades || [];
    for (let j = 0; j < trades.length; j++) {
      const t = trades[j];
      allTrades.push({
        ts: t.exitDate.getTime(),
        date: t.exitDate,
        profit: t.pnl,
        stock: s.name,
        entry: t.entry,
        exit: t.exit,
        shares: t.shares,
      });
    }
  }
  if (!allTrades.length) return null;
  allTrades.sort((a,b) => a.ts - b.ts);
  const pts = [];
  let cum = 0, peak = 0, maxDD = 0, maxDDPeak = 0, maxDDTrough = 0;
  for (let k = 0; k < allTrades.length; k++) {
    cum += allTrades[k].profit;
    if (cum > peak) peak = cum;
    const dd = peak - cum;
    if (dd > maxDD) { maxDD = dd; maxDDPeak = peak; maxDDTrough = cum; }
    pts.push({
      ts: allTrades[k].ts, date: allTrades[k].date,
      profit: allTrades[k].profit, cum, peak, dd,
      stock: allTrades[k].stock,
    });
  }
  return {
    points: pts, allTrades,
    maxDrawdown: maxDD, peakEquity: peak,
    finalEquity: cum, totalProfit: cum,
    tradeCount: allTrades.length,
    maxDDPeak, maxDDTrough,
  };
}

/* ================================================================
   SCREENER ROW
   ================================================================ */
function calcScreenerRow(stock) {
  const rows = stock.rows;
  const last = rows[rows.length - 1];
  let status = "IDLE", label = "⏳ IDLE", priority = 4, detail = "";

  if (stock.openPosition) {
    status = "HOLDING"; label = "📈 HOLDING"; priority = 2;
    detail = "Avg ₹" + fmtN(stock.openPosition.avg) + " → Target ₹" + fmtN(stock.openPosition.target) + " (Parts " + stock.openPosition.partsUsed + "/6)";
  } else if (stock.pendingTrigger) {
    detail = "Next Trigger @ ₹" + fmtN(stock.pendingTrigger);
  }

  for (let i = rows.length - 1; i >= Math.max(0, rows.length - 14); i--) {
    const r = rows[i];
    const re = r.events || [];
    if (re.indexOf("buy") >= 0) {
      const ago = rows.length - 1 - i;
      if (ago <= 1) {
        status = "BUY_TODAY"; label = "✅ BUY"; priority = 0;
        detail = "Buy @ ₹" + fmtN(r.buyPrice) + " (" + (ago === 0 ? "आज" : "कल") + ")";
      }
      break;
    }
    if (re.indexOf("target") >= 0) {
      const ago2 = rows.length - 1 - i;
      if (ago2 <= 1) {
        status = "TARGET_TODAY"; label = "🎯 TARGET"; priority = 0;
        detail = "Target hit (" + (ago2 === 0 ? "आज" : "कल") + ")";
      }
      break;
    }
  }
  return {
    name: stock.name, status, label, priority, detail,
    close: last.close, trigger: last.wkTrigger,
    date: last.date,
    pending: stock.pendingTrigger,
    target: stock.openPosition ? stock.openPosition.target : null,
    avg: stock.openPosition ? stock.openPosition.avg : null,
    parts: stock.openPosition ? stock.openPosition.partsUsed : 0,
  };
}

/* ================================================================
   MINI CHART (Candle / Line)
   ================================================================ */
function MiniChart({ rows, sourceLabel="1W", height=280, chartType="line" }) {
  const [hover, setHover] = useState(null);
  const W=800, H=height, PAD={l:54,r:10,t:20,b:30};
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  if (!rows.length) return null;
  const minV = Math.min(...rows.map(r=>r.low));
  const maxV = Math.max(...rows.map(r=>r.high));
  const range = (maxV-minV)||1;
  const minT = rows[0].ts, maxT = rows[rows.length-1].ts;
  const x = ts => PAD.l + ((ts-minT)/(maxT-minT))*iw;
  const y = v => PAD.t + ih - ((v-minV)/range)*ih;
  const line = k => rows.map((r,i)=>`${i?'L':'M'}${x(r.ts).toFixed(1)},${y(r[k]).toFixed(1)}`).join(' ');
  const yLabels = Array.from({length:6},(_,i)=>minV+(range*i/5));
  const xticks = Math.min(6,rows.length);
  const xIdx = Array.from({length:xticks},(_,i)=>Math.floor(i*(rows.length-1)/(xticks-1||1)));
  const slot = iw / rows.length;
  const bodyW = Math.max(1, Math.min(10, slot * 0.7));
  const trigSegs=[]; let cur=null;
  rows.forEach(r=>{
    const t=r.wkTrigger; if(t==null) return;
    if(!cur||cur.t!==t||cur.wk!==r.wk){ if(cur)trigSegs.push(cur); cur={t,wk:r.wk,x1:x(r.ts),x2:x(r.ts)}; }
    else cur.x2=x(r.ts);
  });
  if(cur)trigSegs.push(cur);
  return (
    <div style={{overflowX:"auto"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:340,height:H,display:"block"}} onMouseLeave={()=>setHover(null)}>
        {yLabels.map((v,i)=>(
          <g key={i}><line x1={PAD.l} x2={W-PAD.r} y1={y(v)} y2={y(v)} stroke="#101f35" strokeDasharray="3 3"/>
          <text x={PAD.l-4} y={y(v)+3} fill="#334a6a" fontSize="10" textAnchor="end">₹{v.toFixed(0)}</text></g>
        ))}
        {xIdx.map(i=>(
          <text key={i} x={x(rows[i].ts)} y={H-10} fill="#334a6a" fontSize="9" textAnchor="middle">
            {`${rows[i].date.getMonth()+1}/${String(rows[i].date.getFullYear()).slice(2)}`}
          </text>
        ))}
        {trigSegs.map((s,i)=>(<line key={'t'+i} x1={s.x1} x2={s.x2} y1={y(s.t)} y2={y(s.t)} stroke="#fbbf24" strokeWidth="1.4" strokeDasharray="4 2" opacity="0.85"/>))}
        {chartType === "candle" && rows.map((r,i)=>{
          const cx = x(r.ts);
          const up = r.close >= r.open;
          const col = up ? "#22c55e" : "#ef4444";
          const top = up ? y(r.close) : y(r.open);
          const bot = up ? y(r.open) : y(r.close);
          const bh = Math.max(1, bot - top);
          return <g key={'c'+i}>
            <line x1={cx} x2={cx} y1={y(r.high)} y2={y(r.low)} stroke={col} strokeWidth="1"/>
            <rect x={cx-bodyW/2} y={top} width={bodyW} height={bh} fill={col} stroke={col} strokeWidth="0.5"/>
          </g>;
        })}
        {chartType === "line" && <path d={line("close")} fill="none" stroke="#60a5fa" strokeWidth="2"/>}
        {rows.map((r,i)=>{
          const ev=r.events||[];
          if(ev.includes("target"))return <circle key={'x'+i} cx={x(r.ts)} cy={y(r.close)} r="5" fill="#a855f7" stroke="#1e0b2e" strokeWidth="1.5"/>;
          if(ev.includes("buy"))   return <circle key={'b'+i} cx={x(r.ts)} cy={y(r.close)} r="5" fill="#4ade80" stroke="#052e16" strokeWidth="1.5"/>;
          if(ev.includes("ignore"))return <circle key={'g'+i} cx={x(r.ts)} cy={y(r.close)} r="3" fill="#64748b"/>;
          return null;
        })}
        {rows.map((r,i)=>(<rect key={i} x={x(r.ts)-slot/2} y={PAD.t} width={slot} height={ih} fill="transparent" onMouseEnter={()=>setHover(r)} onTouchStart={()=>setHover(r)}/>))}
      </svg>
      {hover && (
        <div style={{background:"#0f1e33",border:"1px solid #2a3f5f",borderRadius:8,padding:"8px 12px",fontSize:11,lineHeight:1.7,fontFamily:"monospace",margin:"4px 10px"}}>
          <div style={{fontWeight:700,color:"#a0bde0"}}>{fmtD(hover.date)}</div>
          {chartType === "candle" && <>
            <div style={{color:"#94a3b8"}}>O: ₹{fmtN(hover.open)} H: ₹{fmtN(hover.high)}</div>
            <div style={{color:"#94a3b8"}}>L: ₹{fmtN(hover.low)} C: ₹{fmtN(hover.close)}</div>
          </>}
          {chartType === "line" && <div style={{color:"#60a5fa"}}>Close: ₹{fmtN(hover.close)}</div>}
          {hover.wkTrigger && <div style={{color:"#fbbf24"}}>Trigger: ₹{fmtN(hover.wkTrigger)}</div>}
          {hover.events?.includes("ignore") && <div style={{color:"#64748b",fontWeight:700}}>⚠ IGNORED</div>}
          {hover.events?.includes("buy") && <div style={{color:"#4ade80",fontWeight:700}}>✅ BUY {hover.position?.qty} sh @ ₹{fmtN(hover.buyPrice)}</div>}
          {hover.position && !hover.events?.includes("target") && <div style={{color:"#93c5fd"}}>🎯 ₹{fmtN(hover.position.target)} · Parts {hover.position.partsUsed}/6</div>}
          {hover.events?.includes("target") && <div style={{color:"#a855f7",fontWeight:700}}>🎯 TARGET HIT</div>}
        </div>
      )}
    </div>
  );
}

/* ================================================================
   EQUITY CURVE CHART
   ================================================================ */
function EquityCurveChart({ data, height=280 }) {
  const [hover, setHover] = useState(null);
  if (!data || !data.points.length) {
    return <div style={{padding:30, textAlign:"center", color:"#64748b", fontSize:12}}>
      कोई closed trade नहीं — equity curve के लिए कम से कम 1 trade चाहिए।
    </div>;
  }
  const W = 800, H = height, PAD = { l:75, r:15, t:22, b:30 };
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
  const pts = data.points;
  const firstTs = pts[0].ts;
  const zeroTs = firstTs - 7 * 86400000;
  const extended = [{ts: zeroTs, date: new Date(zeroTs), cum: 0, profit: 0, peak: 0, dd: 0, isStart: true, stock: "Start"}].concat(pts);
  const minTs = extended[0].ts;
  const maxTs = extended[extended.length-1].ts;
  const cums = extended.map(p => p.cum);
  let minV = Math.min(...cums), maxV = Math.max(...cums);
  minV = Math.min(minV, 0); maxV = Math.max(maxV, 0);
  if (minV === maxV) { minV -= 100; maxV += 100; }
  const pad = (maxV - minV) * 0.12;
  minV -= pad; maxV += pad;
  const range = maxV - minV;
  const x = ts => PAD.l + ((ts - minTs) / (maxTs - minTs)) * iw;
  const y = v => PAD.t + ih - ((v - minV) / range) * ih;
  const linePath = extended.map((p, i) => (i?'L':'M') + x(p.ts).toFixed(1) + "," + y(p.cum).toFixed(1)).join(" ");
  const areaPath = linePath + " L " + x(maxTs).toFixed(1) + "," + y(0).toFixed(1) + " L " + x(minTs).toFixed(1) + "," + y(0).toFixed(1) + " Z";
  const yLabels = Array.from({length:5},(_,i)=>minV+(range*i/4));
  const xticks = Math.min(6, extended.length);
  const xIdx = Array.from({length:xticks},(_,i)=>Math.floor(i*(extended.length-1)/(xticks-1||1)));
  let peakIdx = 0;
  for (let k = 1; k < extended.length; k++) if (extended[k].cum > extended[peakIdx].cum) peakIdx = k;
  let troughIdx = -1;
  if (data.maxDrawdown > 0) {
    for (let m = 0; m < extended.length; m++) {
      if (extended[m].dd === data.maxDrawdown) { troughIdx = m; break; }
    }
  }
  const finalCum = pts[pts.length-1].cum;
  const lineCol = finalCum >= 0 ? "#4ade80" : "#f87171";
  const fillCol = finalCum >= 0 ? "rgba(74,222,128,0.10)" : "rgba(248,113,113,0.10)";
  return (
    <div style={{overflowX:"auto"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%", minWidth:340, height, display:"block"}}>
        {yLabels.map((v,k)=>(
          <g key={k}>
            <line x1={PAD.l} x2={W-PAD.r} y1={y(v)} y2={y(v)} stroke="#101f35" strokeDasharray="3 3"/>
            <text x={PAD.l-4} y={y(v)+3} fill="#334a6a" fontSize="10" textAnchor="end">{fmtRs(v)}</text>
          </g>
        ))}
        {minV <= 0 && maxV >= 0 && <line x1={PAD.l} x2={W-PAD.r} y1={y(0)} y2={y(0)} stroke="#475569" strokeWidth="1" strokeDasharray="2 3"/>}
        <path d={areaPath} fill={fillCol}/>
        <path d={linePath} fill="none" stroke={lineCol} strokeWidth="2.2" strokeLinejoin="round"/>
        {extended.map((p, k) => p.isStart ? null : <circle key={k} cx={x(p.ts)} cy={y(p.cum)} r="2.5" fill={lineCol}/>)}
        {peakIdx > 0 && <g>
          <circle cx={x(extended[peakIdx].ts)} cy={y(extended[peakIdx].cum)} r="5" fill="#4ade80" stroke="#052e16" strokeWidth="1.5"/>
          <text x={x(extended[peakIdx].ts)} y={y(extended[peakIdx].cum) - 8} fill="#4ade80" fontSize="9" textAnchor="middle" fontWeight="700">PEAK</text>
        </g>}
        {troughIdx > 0 && <g>
          <circle cx={x(extended[troughIdx].ts)} cy={y(extended[troughIdx].cum)} r="5" fill="#f87171" stroke="#450a0a" strokeWidth="1.5"/>
          <text x={x(extended[troughIdx].ts)} y={y(extended[troughIdx].cum) + 14} fill="#f87171" fontSize="9" textAnchor="middle" fontWeight="700">MAX DD</text>
        </g>}
        {xIdx.map((idx,k)=>(
          <text key={k} x={x(extended[idx].ts)} y={H-10} fill="#334a6a" fontSize="9" textAnchor="middle">
            {(extended[idx].date.getMonth()+1) + "/" + String(extended[idx].date.getFullYear()).slice(2)}
          </text>
        ))}
        {extended.map((p, k) => p.isStart ? null : <rect key={"h"+k} x={x(p.ts)-8} y={PAD.t} width="16" height={ih} fill="transparent" onMouseEnter={()=>setHover(p)} onTouchStart={()=>setHover(p)}/>)}
      </svg>
      {hover && <div style={{background:"#0f1e33",border:"1px solid #2a3f5f",borderRadius:8,padding:"8px 12px",fontSize:11,lineHeight:1.7,fontFamily:"monospace",margin:"4px 10px"}}>
        <div style={{fontWeight:700,color:"#a0bde0"}}>{fmtD(hover.date)}</div>
        <div style={{color:"#93c5fd"}}>{hover.stock}</div>
        {!hover.isStart && <div style={{color:"#94a3b8"}}>Trade: <b style={{color: hover.profit>=0?"#4ade80":"#f87171"}}>{hover.profit>=0?"+":""}{fmtRs(hover.profit)}</b></div>}
        <div style={{color: lineCol, fontWeight:700}}>Cumulative: {hover.cum>=0?"+":""}{fmtRs(hover.cum)}</div>
        {hover.dd > 0 && <div style={{color:"#f87171"}}>Drawdown: -{fmtRs(hover.dd)}</div>}
      </div>}
      <div style={{padding:"6px 14px", fontSize:11, color:"#64748b", display:"flex", gap:14, flexWrap:"wrap"}}>
        <span>Final: <b style={{color: lineCol}}>{finalCum>=0?"+":""}{fmtRs(finalCum)}</b></span>
        <span>Peak: <b style={{color:"#4ade80"}}>{fmtRs(data.peakEquity)}</b></span>
        <span>Max DD: <b style={{color:"#f87171"}}>-{fmtRs(data.maxDrawdown)}</b></span>
        <span>Trades: <b style={{color:"#93c5fd"}}>{data.tradeCount}</b></span>
      </div>
    </div>
  );
}

function PositionSizer({ avg, shares, capital, onChange, C }) {
  const [amtDraft, setAmtDraft] = useState("");
  const [focused, setFocused] = useState(false);
  const qty = shares || 0;
  const entry = avg || 0;

  useEffect(() => {
    if (!focused) setAmtDraft(String(Math.round(qty * entry)));
  }, [qty, entry, focused]);

  const inputStyle = {
    background: C.bg, border: "1px solid " + C.border,
    borderRadius: 6, padding: "5px 8px", color: C.text,
    fontSize: 12, outline: "none", fontFamily: "monospace"
  };
  return (
    <div style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap"}}>
      <div style={{display:"flex", alignItems:"center", gap:4}}>
        <span style={{fontSize:10, color:C.muted}}>Qty</span>
        <input type="number" min="0" step="1" value={qty}
          onChange={e => onChange(parseFloat(e.target.value) || 0)}
          style={{...inputStyle, width:70}}/>
      </div>
      <div style={{display:"flex", alignItems:"center", gap:4}}>
        <span style={{fontSize:10, color:C.muted}}>₹ Amount</span>
        <input type="number" min="0" step="1000" value={amtDraft}
          onFocus={() => { setFocused(true); setAmtDraft(String(Math.round(qty * entry))); }}
          onBlur={() => setFocused(false)}
          onChange={e => {
            setAmtDraft(e.target.value);
            const n = parseFloat(e.target.value);
            if (!isNaN(n) && n >= 0 && entry > 0) onChange(n / entry);
          }}
          style={{...inputStyle, width:110}}/>
      </div>
    </div>
  );
}

/* ================================================================
   MAIN APP
   ================================================================ */
function App() {
  const [stockList, setStockList] = useState([]);
  const [sheetInfo, setSheetInfo] = useState({ loading:true, error:null, cols:[], source:"sheet" });
  const [stocks, setStocks] = useState([]);
  const [active, setActive] = useState(0);
  const [modal, setModal] = useState(false);
  const [listOpen, setListOpen] = useState(false);
  const [csvTxt, setCsvTxt] = useState("");
  const [label, setLabel] = useState("");
  const [err, setErr] = useState("");
  const [view, setView] = useState("chart");
  const [chartType, setChartType] = useState("line");
  const [loadingSym, setLoadingSym] = useState(null);
  const [autoProgress, setAutoProgress] = useState(null);
  const [toast, setToast] = useState(null);
  const [triggerSource, setTriggerSource] = useState("1w");
  const [range, setRange] = useState(DEFAULT_RANGE);
  const [totalCapital, setTotalCapital] = useState(DEFAULT_CAPITAL);
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [bohCache, setBohCache] = useState({});

  // Bulk modal
  const [bulkModal, setBulkModal] = useState(false);
  const [bulkTxt, setBulkTxt] = useState("");
  const [bulkProg, setBulkProg] = useState({current:0, total:0, msg:""});
  const [bulkErrors, setBulkErrors] = useState([]);

  function showToast(msg, type="info") { setToast({msg, type}); setTimeout(()=>setToast(null), 3500); }

  /* ---- Save/Load localStorage ---- */
  function persistStocks(list) {
    try {
      const slim = list.map(s => ({
        name: s.name,
        qty: s.qty || 1,
        rawRows: (s.rawRows || []).map(r => ({
          date: r.date instanceof Date ? r.date.toISOString() : r.date,
          open: r.open, high: r.high, low: r.low, close: r.close, vol: r.vol, ts: r.ts
        })),
        boh: s.boh,
      }));
      localStorage.setItem(STOCKS_KEY, JSON.stringify(slim));
    } catch(e) {}
  }
  function persistSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        triggerSource, range, totalCapital, dateFrom, dateTo
      }));
    } catch(e) {}
  }

  /* ---- Load sheet ---- */
  async function loadSheet() {
    setSheetInfo(prev => ({ ...prev, loading:true, error:null }));
    try {
      const { stocks: list, cols } = await fetchSheetStocks();
      setStockList(list);
      setSheetInfo({ loading:false, error:null, cols, source:"sheet" });
      showToast(`✅ Sheet loaded: ${list.length} stocks`, "success");
    } catch (e) {
      console.error("Sheet fetch failed:", e);
      setStockList(FALLBACK_STOCKS);
      setSheetInfo({ loading:false, error:e.message, cols:[], source:"fallback" });
      showToast(`⚠ Sheet fail: ${e.message}`, "error");
    }
  }

  /* ---- Init ---- */
  useEffect(() => {
    // Load settings
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s.triggerSource) setTriggerSource(s.triggerSource);
        if (s.range) setRange(s.range);
        if (s.totalCapital) setTotalCapital(s.totalCapital);
        if (s.dateFrom) setDateFrom(s.dateFrom);
        if (s.dateTo) setDateTo(s.dateTo);
      }
    } catch(e) {}

    // Load stored stocks (browser refresh pe restore)
    let restored = [];
    try {
      const raw = localStorage.getItem(STOCKS_KEY);
      if (raw) {
        const list = JSON.parse(raw);
        restored = list.map(s => {
          const rawRows = (s.rawRows || []).map(r => ({...r, date: new Date(r.date)}));
          const res = calcWeekly(filterRowsByDate(rawRows, dateFrom, dateTo), triggerSource, totalCapital);
          return { name: s.name, qty: s.qty || 1, rawRows, ...res, boh: s.boh };
        });
        if (restored.length) {
          setStocks(restored);
          setActive(0);
          showToast(`♻ ${restored.length} stocks restored`, "success");
        }
      }
    } catch(e) {}

    loadSheet();
  }, []);

  /* ---- Recompute ---- */
  function recomputeAll(newSource, newFrom, newTo, newCapital) {
    setStocks(prev => {
      const next = prev.map(s => {
        if (!s.rawRows) return s;
        const filtered = filterRowsByDate(s.rawRows, newFrom, newTo);
        if (filtered.length < 5) return { name:s.name, qty:s.qty, rawRows:s.rawRows, rows:[], trades:[], openPosition:null, pendingTrigger:null };
        const res = calcWeekly(filtered, newSource, newCapital);
        return { name:s.name, qty:s.qty, rawRows:s.rawRows, ...res, boh:s.boh };
      });
      persistStocks(next);
      return next;
    });
  }
  function changeTriggerSource(ns) { setTriggerSource(ns); recomputeAll(ns, dateFrom, dateTo, totalCapital); persistSettings(); }
  function changeCapital(nc) { setTotalCapital(nc); recomputeAll(triggerSource, dateFrom, dateTo, nc); persistSettings(); }
  function applyDateRange() { recomputeAll(triggerSource, dateFrom, dateTo, totalCapital); persistSettings(); showToast(`📅 Range applied`, "success"); }
  function resetDateRange() { setDateFrom(""); setDateTo(""); recomputeAll(triggerSource, "", "", totalCapital); persistSettings(); }
  function updateQty(idx, newQty) {
    setStocks(prev => {
      const copy = prev.slice();
      if (!copy[idx]) return prev;
      copy[idx] = { ...copy[idx], qty: newQty };
      persistStocks(copy);
      return copy;
    });
  }

  /* ---- Add stock ---- */
  async function addStockAuto(stock, skipBOH=false) {
    setLoadingSym(stock.sym);
    try {
      const r = await fetchFromYahoo(stock.sym, range);
      const parsed = parseCSV(r.csv);
      if (parsed.error) throw new Error(parsed.error);
      const rawRows = parsed.rows;
      const boh = checkBOH(rawRows);
      setBohCache(prev => ({ ...prev, [stock.sym]: boh }));
      if (!skipBOH && !boh.suitable) showToast(`⚠ ${stock.sym}: ${boh.reason}`, "error");
      else if (!skipBOH) showToast(`✅ ${stock.sym} loaded (BOH pass)`, "success");
      else showToast(`✅ ${stock.sym} loaded`, "success");
      const filtered = filterRowsByDate(rawRows, dateFrom, dateTo);
      const res = calcWeekly(filtered, triggerSource, totalCapital);
      setStocks(p => {
        const name = "NSE:"+stock.sym;
        const idx = p.findIndex(x => x.name === name);
        const newStock = { name, qty: idx >= 0 ? p[idx].qty : 1, rawRows, ...res, boh };
        const next = idx >= 0 ? p.map((x,j)=> j===idx ? newStock : x) : [...p, newStock];
        setActive(idx >= 0 ? idx : next.length-1);
        persistStocks(next);
        return next;
      });
      setLoadingSym(null);
      return true;
    } catch (e) {
      showToast(`❌ ${stock.sym}: ${e.message}`, "error");
      setLoadingSym(null);
      return false;
    }
  }
  async function pickFromList(stock) { const ok = await addStockAuto(stock); if (ok) setListOpen(false); }

  /* ---- Batch Auto Load ---- */
  async function autoLoadAll() {
    const list = stockList;
    if (!list.length) { showToast("Sheet खाली है", "error"); return; }
    setAutoProgress({ done:0, total:list.length, current:"Starting..." });
    const allData = [];
    const BATCH_SIZE = 5;
    for (let i = 0; i < list.length; i += BATCH_SIZE) {
      const batch = list.slice(i, i + BATCH_SIZE);
      setAutoProgress({ done: i, total: list.length, current: batch.map(b => b.sym).join(", ") });
      const promises = batch.map(async (st) => {
        try {
          const r = await fetchFromYahoo(st.sym, range);
          const parsed = parseCSV(r.csv);
          if (parsed.error) return null;
          const rawRows = parsed.rows;
          const boh = checkBOH(rawRows);
          return { sym: st.sym, rawRows, boh };
        } catch (e) { return null; }
      });
      const results = await Promise.all(promises);
      results.forEach(r => { if (r) allData.push(r); });
      if (i + BATCH_SIZE < list.length) await new Promise(r => setTimeout(r, 250));
    }
    const newCache = {};
    allData.forEach(d => { newCache[d.sym] = d.boh; });
    setBohCache(prev => ({ ...prev, ...newCache }));
    const suitable = allData.filter(d => d.boh.suitable);
    const newStocks = suitable.map(d => ({
      name: "NSE:"+d.sym, qty: 1,
      rawRows: d.rawRows,
      ...calcWeekly(filterRowsByDate(d.rawRows, dateFrom, dateTo), triggerSource, totalCapital),
      boh: d.boh
    }));
    setStocks(prev => {
      const merged = [...prev];
      newStocks.forEach(ns => {
        const idx = merged.findIndex(x => x.name === ns.name);
        if (idx >= 0) merged[idx] = { ...merged[idx], ...ns, qty: merged[idx].qty };
        else merged.push(ns);
      });
      persistStocks(merged);
      return merged;
    });
    setAutoProgress(null);
    showToast(`🚀 ${suitable.length}/${allData.length} BOH-suitable loaded`, "success");
    setListOpen(false);
    setActive(0);
  }

  /* ---- Bulk Load ---- */
  async function bulkLoad() {
    const symbols = bulkTxt.split(/[\n,\s]+/).map(s => s.trim().toUpperCase().replace(/^NSE:/, "")).filter(Boolean);
    const unique = [...new Set(symbols)];
    if (!unique.length) return;
    setBulkErrors([]);
    setBulkProg({current: 0, total: unique.length, msg: "शुरू हो रहा है..."});
    const errs = [];
    for (let i = 0; i < unique.length; i++) {
      const sym = unique[i];
      setBulkProg({current: i+1, total: unique.length, msg: sym + " fetch कर रहे हैं..."});
      try {
        const r = await fetchFromYahoo(sym, range);
        const parsed = parseCSV(r.csv);
        if (parsed.error) { errs.push(sym + ": " + parsed.error); continue; }
        const rawRows = parsed.rows;
        const boh = checkBOH(rawRows);
        setBohCache(prev => ({ ...prev, [sym]: boh }));
        const res = calcWeekly(filterRowsByDate(rawRows, dateFrom, dateTo), triggerSource, totalCapital);
        setStocks(p => {
          const name = "NSE:"+sym;
          const idx = p.findIndex(x => x.name === name);
          const newStock = { name, qty: idx >= 0 ? p[idx].qty : 1, rawRows, ...res, boh };
          const next = idx >= 0 ? p.map((x,j)=> j===idx ? newStock : x) : [...p, newStock];
          persistStocks(next);
          return next;
        });
      } catch (e) { errs.push(sym + ": " + e.message); }
      await new Promise(r => setTimeout(r, 350));
    }
    setBulkProg({current: unique.length, total: unique.length, msg: "पूरा हुआ ✅"});
    setBulkErrors(errs);
    setTimeout(() => { setBulkProg({current:0,total:0,msg:""}); setBulkModal(false); setBulkTxt(""); }, 1500);
  }

    const res = calcWeekly(filtered, triggerSource, totalCapital);
    const name = lbl?.trim() || `Stock ${stocks.length+1}`;
    setStocks(p => {
      const next = [...p, { name, qty: 1, rawRows: parsed.rows, ...res, boh }];
      persistStocks(next);
      return next;
    });
    setActive(stocks.length);
    return true;
  }

              ))}
              {s.openPosition && (
                <div style={{background:"#1c1407",border:"1px solid #78350f",borderRadius:10,padding:"10px 14px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                    <span style={{color:"#fde68a",fontWeight:700,fontSize:13}}>OPEN — {fmtD(s.openPosition.entryDate)}</span>
                    <span style={{background:"#1c1407",color:C.gtt,border:"1px solid #78350f",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>⏳ {s.openPosition.partsUsed}/6</span>
                  </div>
                  <div style={{display:"flex",gap:20,fontSize:12,color:"#94a3b8",flexWrap:"wrap"}}>
                    <span>Avg ₹{fmtN(s.openPosition.avg)}</span><span>T ₹{fmtN(s.openPosition.target)}</span>
                    <span>Qty {s.openPosition.shares}</span>
                    <span>Unreal <b style={{color: s.openPosition.unrealized>=0 ? C.buy : "#f87171"}}>₹{inr(s.openPosition.unrealized)}</b></span>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Log view */}
          {view==="log" && (
            <div style={{padding:"0 16px 20px",display:"flex",flexDirection:"column",gap:8}}>
              {events.length===0 && <div style={{color:C.muted,textAlign:"center",padding:40}}>कोई event नहीं।</div>}
              {events.map((r,i)=>{
                const isTgt = r.events.includes("target");
                const isBuy = r.events.includes("buy");
                const isIgn = r.events.includes("ignore");
                const bg = isTgt ? C.tgtBg : isBuy ? C.buyBg : isIgn ? "#0a1628" : C.card;
                const bd = isTgt ? "#6b21a8" : isBuy ? "#166534" : isIgn ? "#334155" : C.border;
                return (
                  <div key={i} style={{background:bg,border:`1px solid ${bd}`,borderRadius:10,padding:"10px 14px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,flexWrap:"wrap",gap:6}}>
                      <span style={{color:C.dim,fontWeight:700,fontSize:13,fontFamily:"monospace"}}>{fmtD(r.date)}</span>
                      <span style={{display:"flex",gap:6}}>
                        {isIgn && <span style={{background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>⚠ IGNORE</span>}
                        {isBuy && <span style={{background:"#052e16",color:C.buy,border:"1px solid #166534",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>✅ BUY</span>}
                        {isTgt && <span style={{background:"#2e1065",color:C.tgt,border:"1px solid #6b21a8",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>🎯 TARGET</span>}
                      </span>
                    </div>
                    <div style={{display:"flex",gap:20,fontSize:12,color:"#94a3b8",flexWrap:"wrap"}}>
                      <span>H ₹{fmtN(r.high)}</span><span>L ₹{fmtN(r.low)}</span><span>C ₹{fmtN(r.close)}</span>
                      {r.wkTrigger && <span>Trg <b style={{color:C.gtt}}>₹{fmtN(r.wkTrigger)}</b></span>}
                      {r.buyPrice && <span>Buy {r.position?.qty} @ <b style={{color:C.buy}}>₹{fmtN(r.buyPrice)}</b></span>}
                      {r.position && <span>T @ <b style={{color:C.tgt}}>₹{fmtN(r.position.target)}</b></span>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Table view */}
          {view==="table" && (
            <div style={{overflowX:"auto",padding:"0 0 20px"}}>
              <div style={{padding:"0 16px 8px"}}>
                <ExportBtn label="📥 Export Full Table CSV" onClick={()=>exportTable(s)}/>
              </div>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead>
                  <tr style={{background:C.card}}>
                    {["Date","Close","Trigger","Ign Low","Ign High","Event"].map(h=>(
                      <th key={h} style={{padding:"8px",textAlign:["Date","Event"].includes(h)?"left":"right",color:C.muted,fontWeight:600,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap",fontSize:10}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[...s.rows].reverse().map((r,i)=>{
                    const isBuy = r.events?.includes("buy");
                    const isTgt = r.events?.includes("target");
                    const isIgn = r.events?.includes("ignore");
                    const bg = isTgt ? C.tgtBg : isBuy ? C.buyBg : isIgn ? "#0a1628" : "transparent";
                    const igL = r.wkTrigger ? r.wkTrigger*(1-IGNORE_PCT) : null;
                    const igH = r.wkTrigger ? r.wkTrigger*(1+IGNORE_PCT) : null;
                    return (
                      <tr key={i} style={{background:bg,borderBottom:"1px solid #0d1a2a"}}>
                        <td style={{padding:"6px 8px",color:C.dim,whiteSpace:"nowrap",fontFamily:"monospace",fontSize:10}}>{fmtD(r.date)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",fontWeight:600,fontFamily:"monospace"}}>{fmtN(r.close)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:C.gtt,fontFamily:"monospace"}}>{r.wkTrigger ? fmtN(r.wkTrigger) : "—"}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:C.muted,fontFamily:"monospace"}}>{igL ? fmtN(igL) : "—"}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:C.muted,fontFamily:"monospace"}}>{igH ? fmtN(igH) : "—"}</td>
                        <td style={{padding:"6px 8px",fontSize:10,whiteSpace:"nowrap"}}>
                          {isIgn && <span style={{color:"#94a3b8",marginRight:6}}>⚠ IGN</span>}
                          {isBuy && <span style={{color:C.buy,marginRight:6}}>✅ BUY</span>}
                          {isTgt && <span style={{color:C.tgt}}>🎯 TGT</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* Screener view */}
          {view==="screener" && (
            <ScreenerView stocks={stocks} sourceLabel={sourceLabel} onSelect={(i)=>{ setActive(i); setView("chart"); }}/>
          )}

          {/* Portfolio view */}
          {view==="portfolio" && (
            <PortfolioView stocks={stocks} onSelect={(i)=>{ setActive(i); setView("chart"); }}/>
          )}
        </div>
      )}

      {/* Stocks list modal */}
      {listOpen && (
        <StocksListModal
          onClose={()=>setListOpen(false)}
          onPick={pickFromList}
          loadingSym={loadingSym}
          autoLoadAll={autoLoadAll}
          autoProgress={autoProgress}
          bohCache={bohCache}
          totalCapital={totalCapital}
          stockList={stockList}
          sheetInfo={sheetInfo}
          reloadSheet={loadSheet}
        />
      )}

      {/* CSV modal */}
      {modal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",display:"flex",alignItems:"flex-end",zIndex:100}}
          onClick={e => e.currentTarget===e.target && (setModal(false), setErr(""))}>
          <div style={{background:"#0d1a2a",borderTop:`1px solid ${C.border}`,borderRadius:"18px 18px 0 0",padding:20,width:"100%",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:18}}>📥 CSV Upload</div>
            <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>📥 Yahoo से (auto)</label>
            <input list="nifty200-list" value={label} onChange={e=>setLabel(e.target.value)} placeholder="Stock चुनें (जैसे: RELIANCE)"
              style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",color:C.text,fontSize:14,boxSizing:"border-box",marginBottom:10,outline:"none"}}/>
            <datalist id="nifty200-list">
              {NIFTY200.map(sym => <option key={sym} value={sym}/>)}
            </datalist>
            <button onClick={async ()=>{
              if (!label.trim()) { setErr("पहले stock चुनें"); return; }
              setErr(""); setLoadingSym(label);
              const ok = await addStockAuto({ sym: label.trim() });
              setLoadingSym(null);
              if (ok) { setLabel(""); setModal(false); }
              else setErr("❌ " + label + " load नहीं हो पाया");
            }} disabled={!!loadingSym}
              style={{width:"100%",background:"#2563eb",color:"#fff",border:"none",borderRadius:8,padding:11,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:14,opacity: loadingSym ? 0.6 : 1}}>
              {loadingSym ? "⏳ " + loadingSym + " fetch हो रहा है..." : "📥 Yahoo से Load करो"}
            </button>
            <div style={{textAlign:"center",fontSize:11,color:C.muted,marginBottom:12}}>─── या manual CSV ───</div>
            <input type="file" accept=".csv,.txt" onChange={onFile}
              style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",color:C.text,fontSize:13,boxSizing:"border-box",marginBottom:10}}/>
            <textarea value={csvTxt} onChange={e=>setCsvTxt(e.target.value)} rows={6}
              placeholder={"Date,Open,High,Low,Close\n3-Oct-22,3440,3460.05,3110.2,3157.3"}
              style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",color:C.text,fontSize:11,fontFamily:"monospace",resize:"vertical",boxSizing:"border-box",marginBottom:10,outline:"none"}}/>
            {err && <div style={{color:"#f87171",background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:8,padding:"8px 12px",fontSize:12,marginBottom:12}}>❌ {err}</div>}
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{ setModal(false); setErr(""); }}
                style={{flex:1,background:C.border,color:C.text,border:"none",borderRadius:10,padding:12,fontSize:14,cursor:"pointer"}}>Cancel</button>
              <button onClick={submitAdd}
                style={{flex:2,background:C.accent,color:"#fff",border:"none",borderRadius:10,padding:12,fontSize:14,fontWeight:700,cursor:"pointer"}}>✅ Manual CSV</button>
            </div>
          </div>
        </div>
      )}

      {/* Bulk modal */}
      {bulkModal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",display:"flex",alignItems:"flex-end",zIndex:100}}
          onClick={e => { if (e.currentTarget === e.target && !bulkProg.total) setBulkModal(false); }}>
          <div style={{background:"#0d1a2a",borderTop:`1px solid ${C.border}`,borderRadius:"18px 18px 0 0",padding:20,width:"100%",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:6,color:"#c4b5fd"}}>⚡ Bulk Add (Yahoo से)</div>
            <div style={{fontSize:11,color:C.muted,marginBottom:14,lineHeight:1.6}}>
              नीचे स्टॉक के symbols डालें — एक-एक लाइन पर या comma से अलग।
            </div>
            <textarea value={bulkTxt} onChange={e=>setBulkTxt(e.target.value)} rows={6}
              placeholder={"RELIANCE\nTCS\nINFY\nHDFCBANK\nICICIBANK"}
              disabled={!!bulkProg.total}
              style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",color:C.text,fontSize:12,fontFamily:"monospace",resize:"vertical",boxSizing:"border-box",marginBottom:10,outline:"none",opacity: bulkProg.total ? 0.5 : 1}}/>
            {bulkProg.total > 0 && (
              <div style={{background:"#1e1b4b",border:"1px solid #7c3aed",borderRadius:8,padding:"10px 12px",fontSize:12,marginBottom:12}}>
                <div style={{color:"#c4b5fd",fontWeight:700,marginBottom:6}}>Progress: {bulkProg.current}/{bulkProg.total}</div>
                <div style={{background:"#0d1a2a",borderRadius:4,height:8,overflow:"hidden",marginBottom:6}}>
                  <div style={{background:"#7c3aed",height:"100%",width:(bulkProg.current/bulkProg.total*100)+"%",transition:"width 0.3s"}}/>
                </div>
                <div style={{color:C.muted,fontSize:11}}>{bulkProg.msg}</div>
              </div>
            )}
            {bulkErrors.length > 0 && (
              <div style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:8,padding:"10px 12px",fontSize:11,marginBottom:12,color:"#fca5a5",maxHeight:150,overflowY:"auto"}}>
                <div style={{fontWeight:700, marginBottom:6}}>⚠️ कुछ symbols fail हुए:</div>
                {bulkErrors.map((e, i) => <div key={i}>• {e}</div>)}
              </div>
            )}
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{ if (!bulkProg.total) { setBulkModal(false); setBulkErrors([]); } }}
                disabled={!!bulkProg.total}
                style={{flex:1,background:C.border,color:C.text,border:"none",borderRadius:10,padding:12,fontSize:14,cursor: bulkProg.total ? "not-allowed" : "pointer",opacity: bulkProg.total ? 0.5 : 1}}>Cancel</button>
              <button onClick={bulkLoad}
                disabled={!!bulkProg.total || !bulkTxt.trim()}
                style={{flex:2,background:"#7c3aed",color:"#fff",border:"none",borderRadius:10,padding:12,fontSize:14,fontWeight:700,cursor: bulkProg.total ? "not-allowed" : "pointer",opacity: (bulkProg.total || !bulkTxt.trim()) ? 0.5 : 1}}>
                {bulkProg.total ? "⏳ " + bulkProg.current + "/" + bulkProg.total : "⚡ Bulk Load करो"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && (
        <div style={{
          position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",
          background: toast.type==="error" ? "#7f1d1d" : "#052e16",
          color: toast.type==="error" ? "#fecaca" : "#86efac",
          border:`1px solid ${toast.type==="error"?"#991b1b":"#166534"}`,
          borderRadius:10,padding:"10px 18px",fontSize:13,fontWeight:600,
          zIndex:999,boxShadow:"0 10px 30px rgba(0,0,0,.5)",maxWidth:"90vw"
        }}>{toast.msg}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
