// ---------- Yahoo Finance Auto Fetch ----------
async function fetchYahooOHLC(symbol, range=DEFAULT_RANGE, interval="1d") {
  const ySym = symbol.toUpperCase() + ".NS";
  const yUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ySym}?range=${range}&interval=${interval}`;
  const proxied = `https://api.allorigins.win/raw?url=${encodeURIComponent(yUrl)}`;
  const res = await fetch(proxied);
  if (!res.ok) throw new Error("Yahoo fetch failed: " + res.status);
  const json = await res.json();
  const result = json?.chart?.result?.[0];
  if (!result) throw new Error("कोई data नहीं मिला");
  const ts = result.timestamp || [];
  const q = result.indicators?.quote?.[0] || {};
  const rows = [];
  for (let i=0; i<ts.length; i++) {
    const o = q.open?.[i], h = q.high?.[i], l = q.low?.[i], c = q.close?.[i], v = q.volume?.[i] || 0;
    if (o==null || h==null || l==null || c==null) continue;
    const date = new Date(ts[i]*1000);
    rows.push({ date, open:o, high:h, low:l, close:c, vol:v, ts: ts[i]*1000 });
  }
  rows.sort((a,b)=>a.ts-b.ts);
  if (rows.length < 10) throw new Error("कम data मिला ("+rows.length+" rows)");
  return rows;
}

// ---------- Date Range Filter ----------
function filterRowsByDate(rows, fromStr, toStr) {
  if (!fromStr && !toStr) return rows;
  const from = fromStr ? new Date(fromStr + "T00:00:00") : null;
  const to = toStr ? new Date(toStr + "T23:59:59") : null;
  return rows.filter(r => {
    if (from && r.date < from) return false;
    if (to && r.date > to) return false;
    return true;
  });
}

function parseCSV(raw) {
  if (!raw?.trim()) return { error: "CSV खाली है।" };
  const lines = raw.trim().split("\n").map(l=>l.trim()).filter(Boolean);
  let hIdx = -1, stockName = "";
  for (let i=0;i<Math.min(lines.length,10);i++) {
    if (/^date/i.test(lines[i])) { hIdx = i; break; }
    const cell = lines[i].split(",")[0]?.trim();
    if (cell && !/^\d/.test(cell) && !/\*/.test(cell) && cell.length>1) stockName = cell;
  }
  if (hIdx===-1) return { error:'"Date,Open,High,Low,Close" header नहीं मिला।' };
  const hdr = lines[hIdx].split(",").map(h=>h.trim().toLowerCase());
  const gi = (...ns) => { for (const n of ns) { const x=hdr.indexOf(n); if (x>=0) return x; } return -1; };
  const di=gi("date","datetime","time"), oi=gi("open"), hi=gi("high"), li=gi("low"), ci=gi("close"), vi=gi("volume","vol");
  if ([di,hi,li].some(x=>x<0)) return { error:"Date/High/Low कॉलम नहीं मिले।" };
  const rows = [];
  for (let i=hIdx+1;i<lines.length;i++) {
    const p = lines[i].split(",");
    if (p.length<4) continue;
    const date = new Date(p[di]?.trim());
    if (isNaN(date.getTime())) continue;
    const high=parseFloat(p[hi]), low=parseFloat(p[li]);
    const close = ci>=0 ? parseFloat(p[ci]) : high;
    const open = oi>=0 ? parseFloat(p[oi]) : close;
    const vol = vi>=0 ? parseInt(p[vi])||0 : 0;
    if (isNaN(high)||isNaN(low)) continue;
    rows.push({ date, open, high, low, close, vol, ts: date.getTime() });
  }
  rows.sort((a,b)=>a.ts-b.ts);
  if (rows.length < 10) return { error: "कम से कम 10 rows चाहिए।" };
  return { stockName, rows };
}

function isoWeekKey(d) {
  const t = new Date(d); t.setHours(0,0,0,0);
  const day = t.getDay() || 7;
  t.setDate(t.getDate() + 4 - day);
  const yStart = new Date(t.getFullYear(),0,1);
  const wk = Math.ceil((((t - yStart)/86400000)+1)/7);
  return t.getFullYear()+"-W"+String(wk).padStart(2,"0");
}

function calcWeekly(rows, sourceKey="1w") {
  const enriched = rows.map(r => ({ ...r, wk: isoWeekKey(r.date), events: [] }));
  const wkHigh = {}, wkLow = {};
  enriched.forEach(r => {
    if (wkHigh[r.wk]==null || r.high>wkHigh[r.wk]) wkHigh[r.wk]=r.high;
    if (wkLow [r.wk]==null || r.low <wkLow [r.wk]) wkLow [r.wk]=r.low;
  });
  const wks = [...new Set(enriched.map(r=>r.wk))];
  const lookback = sourceKey === "2w" ? 2 : sourceKey === "4w" ? 4 : 1;
  const wkTrigger = {};
  wks.forEach((w,i)=>{
    if (i < lookback) { wkTrigger[w] = null; return; }
    let mx = -Infinity;
    for (let j = i-lookback; j < i; j++) {
      if (wkHigh[wks[j]] > mx) mx = wkHigh[wks[j]];
    }
    wkTrigger[w] = mx === -Infinity ? null : mx;
  });
  const rowsOut = enriched.map(r => ({ ...r, wkTrigger: wkTrigger[r.wk], buyPrice: null, position: null }));
  let state = "IDLE";
  let shares=0, cost=0, avg=0, target=0;
  let lastBuyTrig=null, entryDate=null, entryIdx=-1;
  const trades = [];
  let curWk=null, boughtThisWeek=false, ignoredThisWeek=false, soldThisWeek=false;
  for (let i=0;i<rowsOut.length;i++) {
    const r = rowsOut[i];
    const trig = wkTrigger[r.wk];
    if (r.wk !== curWk) {
      curWk = r.wk; boughtThisWeek=false; ignoredThisWeek=false; soldThisWeek=false;
      if (state==="IN_POSITION" && lastBuyTrig!=null && trig!=null) {
        const diff = Math.abs(trig-lastBuyTrig)/lastBuyTrig;
        if (diff <= IGNORE_PCT) { ignoredThisWeek = true; r.events.push("ignore"); }
      }
    }
    if (trig == null) continue;
    if (state==="IN_POSITION" && r.high >= target - 0.0001) {
      const exitPrice = target;
      const pnl = shares*exitPrice - cost;
      trades.push({ entryDate, exitDate: r.date, entry: lastBuyTrig, exit: exitPrice, days: i-entryIdx, shares, cost, proceeds: shares*exitPrice, pnl, pct: (exitPrice/avg-1)*100 });
      r.events.push("target");
      state="IDLE"; shares=0; cost=0; avg=0; target=0;
      lastBuyTrig=null; entryDate=null; entryIdx=-1; soldThisWeek = true;
      continue;
    }
    if (!boughtThisWeek && !ignoredThisWeek && !soldThisWeek && r.low<=trig && trig<=r.high) {
      const qty = trig >= QTY_THRESHOLD ? QTY_HIGH : QTY_LOW;
      shares += qty; cost += qty*trig; avg = cost/shares; target = avg*(1+TARGET_PCT);
      if (state==="IDLE") { entryDate = r.date; entryIdx = i; }
      state = "IN_POSITION"; lastBuyTrig = trig; boughtThisWeek = true;
      r.events.push("buy"); r.buyPrice = trig;
      r.position = { avg, target, shares };
      if (r.high >= target - 0.0001) {
        const exitPrice = target;
        const pnl = shares*exitPrice - cost;
        trades.push({ entryDate, exitDate: r.date, entry: trig, exit: exitPrice, days: i-entryIdx, shares, cost, proceeds: shares*exitPrice, pnl, pct: (exitPrice/avg-1)*100 });
        r.events.push("target");
        state="IDLE"; shares=0; cost=0; avg=0; target=0;
        lastBuyTrig=null; entryDate=null; entryIdx=-1; soldThisWeek = true;
      }
    }
  }
  let openPosition = null;
  if (state==="IN_POSITION") {
    const last = rowsOut[rowsOut.length-1];
    openPosition = { shares, avg, target, lastBuyTrig, entryDate, mark: last.close, unrealized: shares*last.close - cost };
  }
  const lastWk = wks[wks.length-1];
  const pendingTrigger = wkHigh[lastWk];
  return { rows: rowsOut, trades, openPosition, pendingTrigger };
}

function MiniChart({ rows, sourceLabel="1W", height=300 }) {
  const [hover, setHover] = useState(null);
  const W=800, H=height, PAD={l:54,r:10,t:20,b:30};
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  if (!rows.length) return null;
  const minV = Math.min(...rows.map(r=>r.low));
  const maxV = Math.max(...rows.map(r=>r.high));
  const range = (maxV-minV)||1;
  const minT = rows[0].ts, maxT = rows[rows.length-1].ts;
  const x = ts => PAD.l + ((ts-minT)/(maxT-minT))*iw;
  const y = v => PAD.t + ih - ((v-minV)/range)*ih;
  const line = k => rows.map((r,i)=>`${i?'L':'M'}${x(r.ts).toFixed(1)},${y(r[k]).toFixed(1)}`).join(' ');
  const yticks=5;
  const yLabels=Array.from({length:yticks+1},(_,i)=>minV+(range*i/yticks));
  const xticks=Math.min(6,rows.length);
  const xIdx=Array.from({length:xticks},(_,i)=>Math.floor(i*(rows.length-1)/(xticks-1||1)));
  const trigSegs=[]; let cur=null;
  rows.forEach(r=>{
    const t=r.wkTrigger; if(t==null) return;
    if(!cur||cur.t!==t||cur.wk!==r.wk){ if(cur)trigSegs.push(cur); cur={t,wk:r.wk,x1:x(r.ts),x2:x(r.ts)}; }
    else cur.x2=x(r.ts);
  });
  if(cur)trigSegs.push(cur);
  return (
    <div style={{overflowX:"auto"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:340,height:H,display:"block"}} onMouseLeave={()=>setHover(null)}>
        {yLabels.map((v,i)=>(
          <g key={i}><line x1={PAD.l} x2={W-PAD.r} y1={y(v)} y2={y(v)} stroke="#101f35" strokeDasharray="3 3"/>
          <text x={PAD.l-4} y={y(v)+3} fill="#334a6a" fontSize="10" textAnchor="end">₹{v.toFixed(0)}</text></g>
        ))}
        {xIdx.map(i=>(
          <text key={i} x={x(rows[i].ts)} y={H-10} fill="#334a6a" fontSize="9" textAnchor="middle">
            {`${rows[i].date.getMonth()+1}/${String(rows[i].date.getFullYear()).slice(2)}`}
          </text>
        ))}
        {trigSegs.map((s,i)=>(<line key={'t'+i} x1={s.x1} x2={s.x2} y1={y(s.t)} y2={y(s.t)} stroke="#fbbf24" strokeWidth="1.4" strokeDasharray="4 2" opacity="0.85"/>))}
        <path d={line("close")} fill="none" stroke="#60a5fa" strokeWidth="2"/>
        {rows.map((r,i)=>{
          const ev=r.events||[];
          if(ev.includes("target"))return <circle key={'x'+i} cx={x(r.ts)} cy={y(r.close)} r="5" fill="#a855f7" stroke="#1e0b2e" strokeWidth="1.5"/>;
          if(ev.includes("buy"))   return <circle key={'b'+i} cx={x(r.ts)} cy={y(r.close)} r="5" fill="#4ade80" stroke="#052e16" strokeWidth="1.5"/>;
          if(ev.includes("ignore"))return <circle key={'g'+i} cx={x(r.ts)} cy={y(r.close)} r="3" fill="#64748b"/>;
          return null;
        })}
        {rows.map((r,i)=>(<rect key={i} x={x(r.ts)-4} y={PAD.t} width="8" height={ih} fill="transparent" onMouseEnter={()=>setHover(r)} onTouchStart={()=>setHover(r)}/>))}
      </svg>
      {hover && (
        <div style={{background:"#0f1e33",border:"1px solid #2a3f5f",borderRadius:8,padding:"8px 12px",fontSize:11,lineHeight:1.7,fontFamily:"monospace",margin:"4px 10px"}}>
          <div style={{fontWeight:700,color:"#a0bde0"}}>{fmtD(hover.date)}</div>
          <div style={{color:"#60a5fa"}}>Close: ₹{fmtN(hover.close)}</div>
          {hover.wkTrigger && <div style={{color:"#fbbf24"}}>Trigger ({sourceLabel}): ₹{fmtN(hover.wkTrigger)}</div>}
          {hover.events?.includes("ignore") && <div style={{color:"#64748b",fontWeight:700}}>⚠ IGNORED</div>}
          {hover.events?.includes("buy") && <div style={{color:"#4ade80",fontWeight:700}}>✅ BUY @ ₹{fmtN(hover.buyPrice)}</div>}
          {hover.position && !hover.events?.includes("target") && <div style={{color:"#93c5fd"}}>🎯 Target ₹{fmtN(hover.position.target)}</div>}
          {hover.events?.includes("target") && <div style={{color:"#a855f7",fontWeight:700}}>🎯 TARGET HIT</div>}
        </div>
      )}
      <div style={{padding:"4px 14px",fontSize:11,color:"#64748b"}}>
        <span style={{color:"#60a5fa"}}>━ Close</span> &nbsp;
        <span style={{color:"#fbbf24"}}>┄ {sourceLabel} Trigger</span> &nbsp;
        <span style={{color:"#4ade80"}}>● Buy</span> &nbsp;
        <span style={{color:"#a855f7"}}>● Target</span>
      </div>
    </div>
  );
}

function StocksListModal({ onClose, onPick, loadingSym, autoLoadAll, autoProgress }) {
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");
  const filtered = STOCKS_DB.filter(s => {
    if (filter === "S" && s.out !== "S") return false;
    if (filter === "A" && s.out !== "A") return false;
    if (!q) return true;
    const ql = q.toLowerCase();
    return s.sym.toLowerCase().includes(ql) || s.name.toLowerCase().includes(ql);
  });
  const sCount = STOCKS_DB.filter(s=>s.out==="S").length;
  const aCount = STOCKS_DB.filter(s=>s.out==="A").length;
  const C = {
    bg:"#080f1a", card:"#0f1e33", border:"#1e3352", accent:"#2563eb",
    muted:"#64748b", text:"#dce8f8", suit:"#4ade80", avoid:"#f87171"
  };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"flex-end",zIndex:200}}
      onClick={e=>e.currentTarget===e.target && onClose()}>
      <div style={{background:"#0d1a2a",borderTop:`1px solid ${C.border}`,borderRadius:"18px 18px 0 0",padding:16,width:"100%",maxHeight:"92vh",display:"flex",flexDirection:"column"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>📋 Stocks List</div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>
              {STOCKS_DB.length} stocks · <span style={{color:C.suit}}>{sCount} Suitable</span> · <span style={{color:C.avoid}}>{aCount} Avoid</span>
            </div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,fontSize:22,cursor:"pointer"}}>×</button>
        </div>
        <button onClick={autoLoadAll} disabled={!!autoProgress}

            background: autoProgress ? "#1e3352" : "linear-gradient(135deg,#2563eb,#7c3aed)",
            color:"#fff", border:"none", borderRadius:10, padding:"10px 14px",
            fontSize:13, fontWeight:700, cursor: autoProgress ? "wait" : "pointer",
            marginBottom:10, width:"100%"
          }}>
          {autoProgress
            ? `⏳ Loading ${autoProgress.done}/${autoProgress.total} — ${autoProgress.current}...`
            : `🚀 Load All Suitable (${sCount} stocks) — Auto`}
        </button>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search: RELIANCE, INFY, HDFC..."
          style={{width:"100%",background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",color:C.text,fontSize:14,boxSizing:"border-box",outline:"none",marginBottom:8}}/>
        <div style={{display:"flex",gap:6,marginBottom:10}}>
          {[["all","All",STOCKS_DB.length],["S","✅ Suitable",sCount],["A","⛔ Avoid",aCount]].map(([k,l,n])=>(
            <button key={k} onClick={()=>setFilter(k)} style={{
              background: filter===k ? C.accent : "none",

              border:`1px solid ${filter===k ? C.accent : C.border}`,
              borderRadius:8, padding:"5px 12px", fontSize:12, cursor:"pointer", fontWeight: filter===k?700:400
            }}>{l} ({n})</button>
          ))}
        </div>
        <div style={{overflowY:"auto",flex:1,margin:"0 -8px",padding:"0 8px"}}>
          {filtered.length===0 && <div style={{textAlign:"center",color:C.muted,padding:40}}>कोई stock नहीं मिला।</div>}
          {filtered.map(s => {
            const isLoading = loadingSym === s.sym;
            return (
              <div key={s.sym} onClick={()=>!isLoading && !autoProgress && onPick(s)}
                style={{background:C.card,border:`1px solid ${isLoading ? C.accent : C.border}`,borderRadius:10,padding:"10px 12px",marginBottom:8,cursor:(isLoading||autoProgress)?"wait":"pointer",display:"flex",alignItems:"center",gap:10,opacity: autoProgress && !isLoading ? 0.5 : 1}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{color:"#93c5fd",fontWeight:700,fontSize:13,fontFamily:"monospace"}}>{s.sym}</span>
                    <span style={{
                      background: s.out==="S" ? "rgba(74,222,128,.12)" : "rgba(248,113,113,.12)",
                      color: s.out==="S" ? C.suit : C.avoid,
                      border: `1px solid ${s.out==="S" ? "#166534" : "#7f1d1d"}`,
                      borderRadius:20, padding:"1px 8px", fontSize:10, fontWeight:700
                    }}>{s.out==="S" ? "Suitable" : "Avoid"}</span>
                    {isLoading && <span className="spin" style={{color:C.accent}}>⟳</span>}
                  </div>
                  <div style={{fontSize:11,color:C.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</div>
                  <div style={{display:"flex",gap:12,marginTop:5,fontSize:11,color:"#94a3b8",flexWrap:"wrap"}}>
                    <span>CMP: <b style={{color:"#e2e8f0"}}>₹{s.cmp.toLocaleString("en-IN")}</b></span>
                    <span>52H: <b style={{color:C.avoid}}>₹{s.h.toLocaleString("en-IN")}</b></span>
                    <span>52L: <b style={{color:C.suit}}>₹{s.l.toLocaleString("en-IN")}</b></span>
                  </div>
                </div>
                <div style={{color:"#334a6a",fontSize:18}}>{isLoading?"⟳":"›"}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [stocks, setStocks] = useState([]);
  const [active, setActive] = useState(0);
  const [modal, setModal] = useState(false);
  const [listOpen, setListOpen] = useState(false);
  const [csvTxt, setCsvTxt] = useState("");
  const [label, setLabel] = useState("");
  const [err, setErr] = useState("");
  const [view, setView] = useState("chart");
  const [loadingSym, setLoadingSym] = useState(null);
  const [autoProgress, setAutoProgress] = useState(null);
  const [toast, setToast] = useState(null);
  const [triggerSource, setTriggerSource] = useState("1w");
  const [range, setRange] = useState(DEFAULT_RANGE);
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [exportOpen, setExportOpen] = useState(false);

  function showToast(msg, type="info") {
    setToast({msg, type});
    setTimeout(()=>setToast(null), 3000);
  }

  // सारे loaded stocks recompute (trigger source या date range बदलने पर)
  function recomputeAll(newSource, newFrom, newTo) {
    setStocks(prev => prev.map(s => {
      if (!s.rawRows) return s;
      const filtered = filterRowsByDate(s.rawRows, newFrom, newTo);
      if (filtered.length < 5) {
        return { name: s.name, rawRows: s.rawRows, rows: [], trades: [], openPosition: null, pendingTrigger: null };
      }
      const res = calcWeekly(filtered, newSource);
      return { name: s.name, rawRows: s.rawRows, ...res };
    }));
  }

  function changeTriggerSource(newSource) {
    setTriggerSource(newSource);
    recomputeAll(newSource, dateFrom, dateTo);
    const lbl = TRIGGER_SOURCES.find(t=>t.key===newSource)?.label || newSource;
    showToast(`✅ Trigger: ${lbl}`, "success");
  }

  function applyDateRange() {
    recomputeAll(triggerSource, dateFrom, dateTo);
    if (dateFrom || dateTo) {
      showToast(`📅 Date range apply: ${dateFrom || "start"} → ${dateTo || "end"}`, "success");
    } else {
      showToast(`📅 Date filter हटाया`, "success");
    }
  }

  function resetDateRange() {
    setDateFrom(""); setDateTo("");
    recomputeAll(triggerSource, "", "");
    showToast(`📅 Date filter reset`, "success");
  }

  async function addStockAuto(stock) {
    setLoadingSym(stock.sym);
    try {
      const rows = await fetchYahooOHLC(stock.sym, range);
      const filtered = filterRowsByDate(rows, dateFrom, dateTo);
      const res = calcWeekly(filtered, triggerSource);
      setStocks(p => {
        const exists = p.findIndex(x => x.name === "NSE:"+stock.sym);
        const newStock = { name: "NSE:"+stock.sym, rawRows: rows, ...res };
        if (exists >= 0) {
          const copy = [...p]; copy[exists] = newStock; return copy;
        }
        return [...p, newStock];
      });
      setActive(prev => {
        const idx = stocks.findIndex(x => x.name === "NSE:"+stock.sym);
        return idx >= 0 ? idx : stocks.length;
      });
      showToast(`✅ ${stock.sym} loaded (${filtered.length} days)`, "success");
      setLoadingSym(null);
      return true;
    } catch (e) {
      showToast(`❌ ${stock.sym}: ${e.message}`, "error");
      setLoadingSym(null);
      return false;
    }
  }

  async function pickFromList(stock) {
    const ok = await addStockAuto(stock);
    if (ok) setListOpen(false);
  }

  async function autoLoadAll() {
    const suitable = STOCKS_DB.filter(s => s.out === "S");
    setAutoProgress({ done: 0, total: suitable.length, current: "" });
    const newStocks = [];
    for (let i=0; i<suitable.length; i++) {
      const st = suitable[i];
      setAutoProgress({ done: i, total: suitable.length, current: st.sym });
      try {
        const rows = await fetchYahooOHLC(st.sym, range);
        const filtered = filterRowsByDate(rows, dateFrom, dateTo);
        const res = calcWeekly(filtered, triggerSource);
        newStocks.push({ name: "NSE:"+st.sym, rawRows: rows, ...res });
      } catch (e) {}
      await new Promise(r => setTimeout(r, 200));
    }
    setStocks(prev => {
      const merged = [...prev];
      newStocks.forEach(ns => {
        const idx = merged.findIndex(x => x.name === ns.name);
        if (idx >= 0) merged[idx] = ns;
        else merged.push(ns);
      });
      return merged;
    });
    setAutoProgress(null);
    showToast(`🚀 ${newStocks.length} stocks loaded`, "success");
    setListOpen(false);
    setActive(0);
  }

  function handleAdd(csvRaw, lbl) {
    setErr("");
    const parsed = parseCSV(csvRaw);
    if (parsed.error) { setErr(parsed.error); return false; }
    const filtered = filterRowsByDate(parsed.rows, dateFrom, dateTo);
    const res = calcWeekly(filtered, triggerSource);
    const name = lbl?.trim() || parsed.stockName || `Stock ${stocks.length+1}`;
    setStocks(p => [...p, { name, rawRows: parsed.rows, ...res }]);
    setActive(stocks.length);
    return true;
  }
  function submitAdd() {
    if (handleAdd(csvTxt, label)) {
      setCsvTxt(""); setLabel(""); setModal(false);
    }
  }
  function removeStock(idx) {
    setStocks(p => p.filter((_,i)=>i!==idx));
    setActive(a => Math.max(0, a>=idx ? a-1 : a));
  }
  function onFile(e) {
    const f = e.target.files?.[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = ev => setCsvTxt(ev.target.result);
    rd.readAsText(f);
  }

  // ---------- Export CSV ----------
  function exportTradesCSV() {
    if (!stocks.length) { showToast("कोई stock loaded नहीं है", "error"); return; }
    const lines = [];
    lines.push("# Weekly Trigger Backtest Export");
    lines.push(`# Generated: ${new Date().toLocaleString("en-IN")}`);
    lines.push(`# Trigger: ${TRIGGER_SOURCES.find(t=>t.key===triggerSource)?.label}`);
    lines.push(`# Date Range: ${dateFrom || "start"} → ${dateTo || "end"}`);
    lines.push("");
    lines.push("Stock,Entry Date,Exit Date,Buy Price,Exit Price,Qty,Held Days,P&L,Return %");
    let grandPnl = 0, grandTrades = 0, grandWins = 0;
    stocks.forEach(s => {
      const trs = s.trades || [];
      trs.forEach(t => {
        grandPnl += t.pnl; grandTrades++;
        if (t.pnl > 0) grandWins++;
        lines.push([
          s.name,
          fmtDISO(t.entryDate),
          fmtDISO(t.exitDate),
          t.entry.toFixed(2),
          t.exit.toFixed(2),
          t.shares,
          t.days,
          t.pnl.toFixed(2),
          t.pct.toFixed(2)
        ].join(","));
      });
    });
    lines.push("");
    lines.push("SUMMARY");
    lines.push(`Total Stocks,${stocks.length}`);
    lines.push(`Total Trades,${grandTrades}`);
    lines.push(`Winning Trades,${grandWins}`);
    lines.push(`Win Rate,${grandTrades ? ((grandWins/grandTrades)*100).toFixed(2) : 0}%`);
    lines.push(`Total P&L,${grandPnl.toFixed(2)}`);
    lines.push("");
    lines.push("STOCK-WISE SUMMARY");
    lines.push("Stock,Trades,Wins,Losses,Open Position,Total P&L");
    stocks.forEach(s => {
      const trs = s.trades || [];
      const wins = trs.filter(t=>t.pnl>0).length;
      const losses = trs.length - wins;
      const pnl = trs.reduce((a,t)=>a+t.pnl,0);
      const open = s.openPosition ? `${s.openPosition.shares} sh @ ₹${s.openPosition.avg.toFixed(2)}` : "—";
      lines.push([s.name, trs.length, wins, losses, open, pnl.toFixed(2)].join(","));
    });

    const blob = new Blob([lines.join("\n")], {type: "text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `backtest_trades_${fmtDISO(new Date())}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`📥 CSV exported (${grandTrades} trades)`, "success");
    setExportOpen(false);
  }

  function exportEventsCSV() {
    const lines = [];
    lines.push("# Weekly Trigger — Event Log Export");
    lines.push(`# Generated: ${new Date().toLocaleString("en-IN")}`);
    lines.push("");
    lines.push("Stock,Date,Event,Close,Trigger,Buy Price,Target");
    stocks.forEach(s => {
      (s.rows || []).forEach(r => {
        if (!r.events?.length) return;
        r.events.forEach(ev => {
          lines.push([
            s.name,
            fmtDISO(r.date),
            ev,
            r.close.toFixed(2),
            r.wkTrigger ? r.wkTrigger.toFixed(2) : "",
            r.buyPrice ? r.buyPrice.toFixed(2) : "",
            r.position ? r.position.target.toFixed(2) : ""
          ].join(","));
        });
      });
    });
    const blob = new Blob([lines.join("\n")], {type: "text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `backtest_events_${fmtDISO(new Date())}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`📥 Events CSV exported`, "success");
    setExportOpen(false);
  }

  function exportPortfolioCSV() {
    const lines = [];
    lines.push("# Portfolio Summary");
    lines.push(`# Generated: ${new Date().toLocaleString("en-IN")}`);
    lines.push(`# Trigger: ${TRIGGER_SOURCES.find(t=>t.key===triggerSource)?.label}`);
    lines.push("");
    lines.push("Stock,Trades,Wins,Losses,Win %,Total P&L,Open Qty,Open Avg,Open Unrealized");
    let gP=0, gT=0, gW=0;
    stocks.forEach(s => {
      const trs = s.trades || [];
      const wins = trs.filter(t=>t.pnl>0).length;
      const pnl = trs.reduce((a,t)=>a+t.pnl,0);
      gP+=pnl; gT+=trs.length; gW+=wins;
      lines.push([
        s.name, trs.length, wins, trs.length-wins,
        trs.length ? ((wins/trs.length)*100).toFixed(1) : "0",
        pnl.toFixed(2),
        s.openPosition ? s.openPosition.shares : "",
        s.openPosition ? s.openPosition.avg.toFixed(2) : "",
        s.openPosition ? s.openPosition.unrealized.toFixed(2) : ""
      ].join(","));
    });
    lines.push("");
    lines.push(`TOTAL,${gT},${gW},${gT-gW},${gT?((gW/gT)*100).toFixed(1):0},${gP.toFixed(2)},,,`);

    const blob = new Blob([lines.join("\n")], {type: "text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `backtest_portfolio_${fmtDISO(new Date())}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`📥 Portfolio CSV exported`, "success");
    setExportOpen(false);
  }

  const s = stocks[active];
  const last = s?.rows?.[s.rows.length-1];
  const C = {
    bg:"#080f1a", card:"#0f1e33", border:"#1e3352", accent:"#2563eb",
    dim:"#4a6fa5", muted:"#64748b",
    buy:"#4ade80", buyBg:"rgba(74,222,128,0.08)",
    gtt:"#fbbf24", gttBg:"rgba(251,191,36,0.08)",
    tgt:"#a855f7", tgtBg:"rgba(168,85,247,0.08)",
    text:"#dce8f8",
  };
  const card = (sx={}) => ({ background:C.card, border:`1px solid ${C.border}`, borderRadius:10, ...sx });
  const views = [
    { key:"chart",  lbl:"📊 Chart" },
    { key:"trades", lbl:"💼 Trades" },
    { key:"log",    lbl:"📜 Event Log" },
    { key:"table",  lbl:"📋 Table" },
  ];
  const events = s ? s.rows.filter(r => r.events?.length) : [];
  const totalPnL = s ? s.trades.reduce((a,t)=>a+t.pnl,0) : 0;
  const wins = s ? s.trades.filter(t=>t.pnl>0).length : 0;
  const sourceLabel = TRIGGER_SOURCES.find(t=>t.key===triggerSource)?.label.split(" ")[0] || "1W";

  // Overall portfolio stats
  const portfolioTrades = stocks.reduce((a,s)=>a+(s.trades?.length||0),0);
  const portfolioPnl = stocks.reduce((a,s)=>a+((s.trades||[]).reduce((x,t)=>x+t.pnl,0)),0);
  const portfolioWins = stocks.reduce((a,s)=>a+((s.trades||[]).filter(t=>t.pnl>0).length),0);

  return (
    <div style={{ fontFamily:"'Inter',system-ui,sans-serif", background:C.bg, color:C.text, minHeight:"100vh", fontSize:14 }}>
      {/* Row 1: Title + Main Controls */}
      <div style={{ background:C.card, padding:"10px 14px", display:"flex", alignItems:"center", gap:8, borderBottom:`1px solid ${C.border}`, flexWrap:"wrap" }}>
        <div style={{ flex:1, minWidth:140 }}>
          <span style={{ fontWeight:700, fontSize:15 }}>📈 Weekly Trigger Backtest</span>
        </div>
        <select value={triggerSource} onChange={e=>changeTriggerSource(e.target.value)}
          style={{ background:C.bg, color:C.text, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:12, cursor:"pointer", outline:"none" }}>
          {TRIGGER_SOURCES.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
        </select>
        <select value={range} onChange={e=>setRange(e.target.value)}
          style={{ background:C.bg, color:C.text, border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 10px", fontSize:12, cursor:"pointer", outline:"none" }}>
          <option value="6mo">6M</option>
          <option value="1y">1Y</option>
          <option value="2y">2Y</option>
          <option value="5y">5Y</option>
        </select>
        <button onClick={()=>setListOpen(true)}
          style={{ background:"none", color:"#93c5fd", border:`1px solid ${C.border}`, borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer" }}>
          📋 Stocks
        </button>
        <button onClick={()=>setModal(true)}
          style={{ background:C.accent, color:"#fff", border:"none", borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer" }}>
          + CSV
        </button>
      </div>

      {/* Row 2: Date Range + Export */}
      <div style={{ background:"#0a1628", padding:"8px 14px", display:"flex", alignItems:"center", gap:8, borderBottom:`1px solid ${C.border}`, flexWrap:"wrap" }}>
        <span style={{ fontSize:11, color:C.muted, fontWeight:600 }}>📅 Date Range:</span>
        <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}
          style={{ background:C.bg, color:C.text, border:`1px solid ${C.border}`, borderRadius:8, padding:"5px 8px", fontSize:12, outline:"none" }}/>
        <span style={{ color:C.muted, fontSize:12 }}>→</span>
        <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)}
          style={{ background:C.bg, color:C.text, border:`1px solid ${C.border}`, borderRadius:8, padding:"5px 8px", fontSize:12, outline:"none" }}/>
        <button onClick={applyDateRange}
          style={{ background:C.accent, color:"#fff", border:"none", borderRadius:8, padding:"5px 12px", fontSize:12, fontWeight:600, cursor:"pointer" }}>
          Apply
        </button>
        {(dateFrom || dateTo) && (
          <button onClick={resetDateRange}
            style={{ background:"none", color:C.muted, border:`1px solid ${C.border}`, borderRadius:8, padding:"5px 12px", fontSize:12, cursor:"pointer" }}>
            ✕ Reset
          </button>
        )}
        <div style={{ flex:1 }}/>
        <button onClick={()=>setExportOpen(true)}
          disabled={!stocks.length}
          style={{
            background: stocks.length ? "linear-gradient(135deg,#16a34a,#22c55e)" : C.border,
            color:"#fff", border:"none", borderRadius:8, padding:"5px 14px",
            fontSize:12, fontWeight:700, cursor: stocks.length ? "pointer" : "not-allowed",
            opacity: stocks.length ? 1 : 0.5
          }}>
          📥 Export CSV
        </button>
      </div>

      {autoProgress && (
        <div style={{background:"#1e3352",padding:"8px 16px",fontSize:12,color:"#93c5fd",borderBottom:`1px solid ${C.border}`}}>
          ⏳ Auto-loading {autoProgress.done}/{autoProgress.total} — {autoProgress.current}
          <div style={{background:"#0d1a2a",height:4,borderRadius:2,marginTop:6,overflow:"hidden"}}>
            <div style={{background:C.accent,height:"100%",width:`${(autoProgress.done/autoProgress.total)*100}%`,transition:"width 0.3s"}}/>
          </div>
        </div>
      )}

      {stocks.length>0 && (
        <div style={{ display:"flex", overflowX:"auto", background:C.card, borderBottom:`1px solid ${C.border}`, padding:"0 8px" }}>
          {stocks.map((st,i)=>(
            <div key={i} style={{ display:"flex", alignItems:"center", gap:4 }}>
              <button onClick={()=>setActive(i)} style={{
                background:"none", border:"none",
                borderBottom: active===i ? `2px solid ${C.accent}` : "2px solid transparent",
                color: active===i ? "#93c5fd" : C.muted,
                padding:"9px 10px", fontSize:12, fontWeight: active===i ? 700 : 400,
                cursor:"pointer", whiteSpace:"nowrap"
              }}>{st.name.replace("NSE:","")}</button>
              <button onClick={()=>removeStock(i)}
                style={{ background:"none", border:"none", color:C.muted, cursor:"pointer", fontSize:14, padding:"0 4px 0 0", lineHeight:1 }}>×</button>
            </div>
          ))}
          {stocks.length > 1 && (
            <div style={{
              marginLeft:"auto", padding:"9px 12px", fontSize:11, color:C.muted,
              whiteSpace:"nowrap", borderLeft:`1px solid ${C.border}`
            }}>
              📊 {stocks.length} stocks · ₹{inr(portfolioPnl)} · {portfolioTrades} trades
            </div>
          )}
        </div>
      )}

      {!s && !autoProgress && (
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:18, padding:48, minHeight:"60vh", textAlign:"center" }}>
          <div style={{ fontSize:52 }}>🚀</div>
          <div>
            <div style={{ fontWeight:700, fontSize:20, marginBottom:6 }}>Auto Backtest — One Click</div>
            <div style={{ color:C.muted, fontSize:13 }}>Stocks list से कोई stock चुनें — data अपने आप आ जाएगा</div>
          </div>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", justifyContent:"center" }}>
            <button onClick={()=>setListOpen(true)} style={{ background:"linear-gradient(135deg,#2563eb,#7c3aed)", color:"#fff", border:"none", borderRadius:10, padding:"13px 26px", fontSize:15, fontWeight:700, cursor:"pointer" }}>
              📋 Stocks List खोलें
            </button>
            <button onClick={autoLoadAll} style={{ background:"none", color:"#93c5fd", border:`1px solid ${C.border}`, borderRadius:10, padding:"13px 26px", fontSize:15, fontWeight:700, cursor:"pointer" }}>
              🚀 Load All Suitable
            </button>
          </div>
          <div style={{ ...card(), padding:"12px 18px", maxWidth:480, textAlign:"left" }}>
            <div style={{ fontSize:12, color:C.muted, lineHeight:1.9 }}>
              <b style={{color:C.text}}>Features:</b><br/>
              📊 <b style={{color:"#93c5fd"}}>Auto-fetch</b> Yahoo Finance से (default 1 साल)<br/>
              🎯 <b style={{color:C.gtt}}>Trigger</b>: 1W / 2W / 4W High चुनें<br/>
              📅 <b style={{color:"#22c55e"}}>Date Range</b>: किसी specific period का backtest<br/>
              📥 <b style={{color:"#22c55e"}}>Export CSV</b>: trades, events, portfolio download
            </div>
          </div>
        </div>
      )}

      {s && (
        <div>
          <div style={{ display:"flex", gap:10, padding:"14px 16px", overflowX:"auto" }}>
            {[
              { lbl:"Total Days",   val: s.rows.length, clr: C.dim },
              { lbl:"Closed Trades",val: s.trades.length, clr: C.buy },
              { lbl:"Win Rate",     val: s.trades.length ? `${Math.round(wins/s.trades.length*100)}%` : "—", clr:"#93c5fd" },
              { lbl:"Total P&L",    val:`₹${inr(totalPnL)}`, clr: totalPnL>=0 ? C.buy : "#f87171" },
              { lbl:"Open Pos",     val: s.openPosition ? `${s.openPosition.shares} sh` : "0", clr: s.openPosition ? C.gtt : C.muted },
              { lbl:"Latest Close", val:`₹${fmtN(last?.close)}`, clr:"#93c5fd" },
            ].map((c,i)=>(
              <div key={i} style={{ ...card(), padding:"10px 16px", minWidth:100, textAlign:"center", flexShrink:0 }}>
                <div style={{ fontSize:16, fontWeight:700, color:c.clr, fontFamily:"monospace" }}>{c.val}</div>
                <div style={{ fontSize:10, color:C.muted, marginTop:2 }}>{c.lbl}</div>
              </div>
            ))}
          </div>
          <div style={{ margin:"0 16px 12px", ...card(), padding:"10px 16px", display:"flex", gap:12, alignItems:"center", flexWrap:"wrap" }}>
            <span style={{ fontSize:11, color:C.muted }}>Status ({fmtD(last?.date)}):</span>
            <span style={{background:"#0a1628",color:"#fbbf24",border:"1px solid #78350f",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700}}>
              🎯 {sourceLabel} Trigger
            </span>
            {(dateFrom || dateTo) && (
              <span style={{background:"#0a2e1a",color:"#4ade80",border:"1px solid #166534",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700}}>
                📅 {dateFrom || "start"} → {dateTo || "end"}
              </span>
            )}
            {s.openPosition ? (
              <span style={{ background:"#04130b", color:C.buy, border:"1px solid #166534", borderRadius:6, padding:"3px 10px", fontSize:12, fontWeight:700 }}>
                📈 HOLDING {s.openPosition.shares} @ ₹{fmtN(s.openPosition.avg)} — Target ₹{fmtN(s.openPosition.target)}
                <span style={{ color: s.openPosition.unrealized>=0 ? C.buy : "#f87171", marginLeft:8 }}>
                  ({s.openPosition.unrealized>=0?"+":""}₹{inr(s.openPosition.unrealized)})
                </span>
              </span>
            ) : s.pendingTrigger ? (
              <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:6, padding:"3px 10px", fontSize:12, fontWeight:700 }}>
                🔔 Next Trigger @ ₹{fmtN(s.pendingTrigger)}
              </span>
            ) : (
              <span style={{ color:C.muted, fontSize:12 }}>⏳ IDLE</span>
            )}
          </div>
          <div style={{ padding:"0 16px 12px", display:"flex", gap:6, overflowX:"auto" }}>
            {views.map(v=>(
              <button key={v.key} onClick={()=>setView(v.key)} style={{
                background: view===v.key ? C.accent : "none",
                color: view===v.key ? "#fff" : C.muted,
                border: `1px solid ${view===v.key ? C.accent : C.border}`,
                borderRadius:8, padding:"6px 12px", fontSize:12,
                cursor:"pointer", fontWeight: view===v.key ? 700 : 400, whiteSpace:"nowrap"
              }}>{v.lbl}</button>
            ))}
          </div>
          {view==="chart" && (
            <div style={{ padding:"0 10px 20px" }}>
              <div style={{ ...card(), padding:"10px 0" }}>
                <div style={{ paddingLeft:14, fontSize:12, color:C.muted, marginBottom:6 }}>{s.name} — Close + {sourceLabel} Trigger</div>
                <MiniChart rows={s.rows} sourceLabel={sourceLabel}/>
              </div>
            </div>
          )}
          {view==="trades" && (
            <div style={{ padding:"0 16px 20px", display:"flex", flexDirection:"column", gap:8 }}>
              {s.trades.length===0 && !s.openPosition && (
                <div style={{ color:C.muted, textAlign:"center", padding:40 }}>कोई closed trade नहीं।</div>
              )}
              {s.trades.map((t,i)=>(
                <div key={i} style={{ background:"#04130b", border:"1px solid #166534", borderRadius:10, padding:"10px 14px" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6, flexWrap:"wrap", gap:6 }}>
                    <span style={{ color:"#86efac", fontWeight:700, fontSize:13 }}>#{s.trades.length-i} — {fmtD(t.entryDate)} → {fmtD(t.exitDate)}</span>
                    <span style={{ background:"#052e16", color:C.buy, border:"1px solid #166534", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>
                      🎯 +{t.pct.toFixed(2)}% · ₹{inr(t.pnl)}
                    </span>
                  </div>
                  <div style={{ display:"flex", gap:20, fontSize:12, color:"#94a3b8", flexWrap:"wrap" }}>
                    <span>Buy @ <b style={{color:C.buy}}>₹{fmtN(t.entry)}</b></span>
                    <span>Exit @ <b style={{color:C.tgt}}>₹{fmtN(t.exit)}</b></span>
                    <span>Qty: <b>{t.shares}</b></span>
                    <span>Held: <b>{t.days}</b> दिन</span>
                  </div>
                </div>
              ))}
              {s.openPosition && (
                <div style={{ background:"#1c1407", border:"1px solid #78350f", borderRadius:10, padding:"10px 14px" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                    <span style={{ color:"#fde68a", fontWeight:700, fontSize:13 }}>OPEN — {fmtD(s.openPosition.entryDate)}</span>
                    <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>⏳ HOLDING</span>
                  </div>
                  <div style={{ display:"flex", gap:20, fontSize:12, color:"#94a3b8", flexWrap:"wrap" }}>
                    <span>Avg: <b style={{color:C.buy}}>₹{fmtN(s.openPosition.avg)}</b></span>
                    <span>Target: <b style={{color:C.tgt}}>₹{fmtN(s.openPosition.target)}</b></span>
                    <span>Qty: <b>{s.openPosition.shares}</b></span>
                    <span>Unreal: <b style={{color: s.openPosition.unrealized>=0 ? C.buy : "#f87171"}}>₹{inr(s.openPosition.unrealized)}</b></span>
                  </div>
                </div>
              )}
            </div>
          )}
          {view==="log" && (
            <div style={{ padding:"0 16px 20px", display:"flex", flexDirection:"column", gap:8 }}>
              {events.length===0 && <div style={{ color:C.muted, textAlign:"center", padding:40 }}>कोई event नहीं।</div>}
              {events.map((r,i)=>{
                const isTgt = r.events.includes("target");
                const isBuy = r.events.includes("buy");
                const isIgn = r.events.includes("ignore");
                const bg = isTgt ? C.tgtBg : isBuy ? C.buyBg : isIgn ? "#0a1628" : C.card;
                const bd = isTgt ? "#6b21a8" : isBuy ? "#166534" : isIgn ? "#334155" : C.border;
                return (
                  <div key={i} style={{ background:bg, border:`1px solid ${bd}`, borderRadius:10, padding:"10px 14px" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6, flexWrap:"wrap", gap:6 }}>
                      <span style={{ color:C.dim, fontWeight:700, fontSize:13, fontFamily:"monospace" }}>{fmtD(r.date)}</span>
                      <span style={{ display:"flex", gap:6 }}>
                        {isIgn && <span style={{ background:"#1e293b", color:"#94a3b8", border:"1px solid #334155", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>⚠ IGNORE</span>}
                        {isBuy && <span style={{ background:"#052e16", color:C.buy, border:"1px solid #166534", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>✅ BUY</span>}
                        {isTgt && <span style={{ background:"#2e1065", color:C.tgt, border:"1px solid #6b21a8", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>🎯 TARGET</span>}
                      </span>
                    </div>
                    <div style={{ display:"flex", gap:20, fontSize:12, color:"#94a3b8", flexWrap:"wrap" }}>
                      <span>H: ₹{fmtN(r.high)}</span>
                      <span>L: ₹{fmtN(r.low)}</span>
                      <span>C: ₹{fmtN(r.close)}</span>
                      {r.wkTrigger && <span>Trigger @ <b style={{color:C.gtt}}>₹{fmtN(r.wkTrigger)}</b></span>}
                      {r.buyPrice && <span>Bought @ <b style={{color:C.buy}}>₹{fmtN(r.buyPrice)}</b></span>}
                      {r.position && <span>Target @ <b style={{color:C.tgt}}>₹{fmtN(r.position.target)}</b></span>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {view==="table" && (
            <div style={{ overflowX:"auto", padding:"0 0 20px" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
                <thead>
                  <tr style={{ background:C.card }}>
                    {["Date","Close","Trigger","Ign Low","Ign High","Event"].map(h=>(
                      <th key={h} style={{ padding:"8px", textAlign:["Date","Event"].includes(h)?"left":"right", color:C.muted, fontWeight:600, borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap", fontSize:10 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[...s.rows].reverse().map((r,i)=>{
                    const isBuy = r.events?.includes("buy");
                    const isTgt = r.events?.includes("target");
                    const isIgn = r.events?.includes("ignore");
                    const bg = isTgt ? C.tgtBg : isBuy ? C.buyBg : isIgn ? "#0a1628" : "transparent";
                    const igL = r.wkTrigger ? r.wkTrigger*(1-IGNORE_PCT) : null;
                    const igH = r.wkTrigger ? r.wkTrigger*(1+IGNORE_PCT) : null;
                    return (
                      <tr key={i} style={{ background:bg, borderBottom:"1px solid #0d1a2a" }}>
                        <td style={{ padding:"6px 8px", color:C.dim, whiteSpace:"nowrap", fontFamily:"monospace", fontSize:10 }}>{fmtD(r.date)}</td>
                        <td style={{ padding:"6px 8px", textAlign:"right", fontWeight:600, fontFamily:"monospace" }}>{fmtN(r.close)}</td>
                        <td style={{ padding:"6px 8px", textAlign:"right", color:C.gtt, fontFamily:"monospace" }}>{r.wkTrigger ? fmtN(r.wkTrigger) : "—"}</td>
                        <td style={{ padding:"6px 8px", textAlign:"right", color:C.muted, fontFamily:"monospace" }}>{igL ? fmtN(igL) : "—"}</td>
                        <td style={{ padding:"6px 8px", textAlign:"right", color:C.muted, fontFamily:"monospace" }}>{igH ? fmtN(igH) : "—"}</td>
                        <td style={{ padding:"6px 8px", fontSize:10, whiteSpace:"nowrap" }}>
                          {isIgn && <span style={{ color:"#94a3b8", marginRight:6 }}>⚠ IGN</span>}
                          {isBuy && <span style={{ color:C.buy, marginRight:6 }}>✅ BUY</span>}
                          {isTgt && <span style={{ color:C.tgt }}>🎯 TGT</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {listOpen && <StocksListModal onClose={()=>setListOpen(false)} onPick={pickFromList} loadingSym={loadingSym} autoLoadAll={autoLoadAll} autoProgress={autoProgress} />}

      {exportOpen && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}}
          onClick={e=>e.currentTarget===e.target && setExportOpen(false)}>
          <div style={{background:"#0d1a2a",border:`1px solid ${C.border}`,borderRadius:14,padding:20,width:"100%",maxWidth:400}}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>📥 Export CSV</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:16}}>
              {stocks.length} stocks loaded · {portfolioTrades} trades · ₹{inr(portfolioPnl)} P&L
            </div>
            <button onClick={exportTradesCSV}
              style={{width:"100%",background:"linear-gradient(135deg,#16a34a,#22c55e)",color:"#fff",border:"none",borderRadius:10,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:10}}>
              💼 Trades CSV<br/>
              <span style={{fontSize:11,fontWeight:400,opacity:0.9}}>सारे trades + stock-wise summary</span>
            </button>
            <button onClick={exportEventsCSV}
              style={{width:"100%",background:"linear-gradient(135deg,#2563eb,#3b82f6)",color:"#fff",border:"none",borderRadius:10,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:10}}>
              📜 Events CSV<br/>
              <span style={{fontSize:11,fontWeight:400,opacity:0.9}}>सारे Buy / Target / Ignore events</span>
            </button>
            <button onClick={exportPortfolioCSV}
              style={{width:"100%",background:"linear-gradient(135deg,#7c3aed,#a855f7)",color:"#fff",border:"none",borderRadius:10,padding:"12px",fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:10}}>
              📊 Portfolio CSV<br/>
              <span style={{fontSize:11,fontWeight:400,opacity:0.9}}>सारे stocks का summary एक साथ</span>
            </button>
            <button onClick={()=>setExportOpen(false)}
              style={{width:"100%",background:C.border,color:C.text,border:"none",borderRadius:10,padding:"10px",fontSize:13,cursor:"pointer",marginTop:4}}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {modal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.8)", display:"flex", alignItems:"flex-end", zIndex:100 }}
          onClick={e => e.currentTarget===e.target && (setModal(false), setErr(""))}>
          <div style={{ background:"#0d1a2a", borderTop:`1px solid ${C.border}`, borderRadius:"18px 18px 0 0", padding:20, width:"100%", maxHeight:"90vh", overflowY:"auto" }}>
            <div style={{ fontWeight:700, fontSize:16, marginBottom:18 }}>📥 CSV Upload (Optional)</div>
            <label style={{ fontSize:12, color:C.muted, display:"block", marginBottom:4 }}>Stock का नाम</label>
            <input value={label} onChange={e=>setLabel(e.target.value)} placeholder="जैसे: NSE:RELIANCE"
              style={{ width:"100%", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:14, boxSizing:"border-box", marginBottom:14, outline:"none" }}/>
            <label style={{ fontSize:12, color:C.muted, display:"block", marginBottom:4 }}>CSV File Upload</label>
            <input type="file" accept=".csv,.txt" onChange={onFile}
              style={{ width:"100%", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:13, boxSizing:"border-box", marginBottom:10 }}/>
            <label style={{ fontSize:12, color:C.muted, display:"block", marginBottom:4 }}>या CSV Paste करें</label>
            <textarea value={csvTxt} onChange={e=>setCsvTxt(e.target.value)} rows={9}
              placeholder={"Date,Open,High,Low,Close\n3-Oct-22,3440,3460.05,3110.2,3157.3"}
              style={{ width:"100%", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:11, fontFamily:"monospace", resize:"vertical", boxSizing:"border-box", marginBottom:10, outline:"none" }}/>
            {err && (
              <div style={{ color:"#f87171", background:"rgba(239,68,68,.1)", border:"1px solid rgba(239,68,68,.3)", borderRadius:8, padding:"8px 12px", fontSize:12, marginBottom:12 }}>❌ {err}</div>
            )}
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={()=>{ setModal(false); setErr(""); }}
                style={{ flex:1, background:C.border, color:C.text, border:"none", borderRadius:10, padding:12, fontSize:14, cursor:"pointer" }}>Cancel</button>
              <button onClick={submitAdd}
                style={{ flex:2, background:C.accent, color:"#fff", border:"none", borderRadius:10, padding:12, fontSize:14, fontWeight:700, cursor:"pointer" }}>✅ Backtest चलाओ</button>
            </div>
          </div>
        </div>
      )}

      {toast && (
        <div style={{
          position:"fixed", top:16, left:"50%", transform:"translateX(-50%)",
          background: toast.type==="error" ? "#7f1d1d" : "#052e16",
          color: toast.type==="error" ? "#fecaca" : "#86efac",
          border: `1px solid ${toast.type==="error" ? "#991b1b" : "#166534"}`,
          borderRadius:10, padding:"10px 18px", fontSize:13, fontWeight:600,
          zIndex:999, boxShadow:"0 10px 30px rgba(0,0,0,.5)", maxWidth:"90vw"
        }}>{toast.msg}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
